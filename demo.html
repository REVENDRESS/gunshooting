<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GunShooter — MONO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }
  canvas { display: block; cursor: none; }

  /* ════════════════════════════════════════════════════
     INVENTORY  —  2025 Dark Game UI
     ════════════════════════════════════════════════════ */
  :root {
    --iv-void:    #202020;
    --iv-card:    #303030;
    --iv-card-hi: #454545;
    --iv-gold:    #ffffff;
    --iv-text:    #f5f5f5;
    --iv-muted:   #d0d0d0;
    --iv-dim:     #b8b8b8;
    --iv-gap:     5px;
  }

  #inv {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  #inv.open { pointer-events: all; }

  .iv-bg {
    position: absolute;
    inset: 0;
    background: rgba(2,2,2, 0.88);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  #inv.open .iv-bg { opacity: 1; }

  .iv-win {
    position: relative;
    width: min(93vw, 1100px);
    height: min(88vh, 700px);
    display: grid;
    grid-template-rows: 40% 1fr;
    gap: var(--iv-gap);
    clip-path: inset(50% 0 50% 0);
    transition: clip-path 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #inv.open .iv-win { clip-path: inset(0% 0 0% 0); }

  /* ── Panel base ── */
  .iv-panel {
    background: var(--iv-void);
    overflow: hidden;
    position: relative;
  }
  .iv-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg,
      transparent 4%, rgba(148,148,148,0.70) 28%,
      rgba(148,148,148,0.70) 72%, transparent 96%);
    pointer-events: none;
  }
  .iv-hd {
    padding: 10px 16px 0;
    font: 700 9px/1 Orbitron, monospace;
    letter-spacing: .22em;
    color: #dddddd;
    text-transform: uppercase;
    user-select: none;
  }

  /* ── Top panel ── */
  .iv-top-body {
    display: grid;
    grid-template-columns: 190px 1fr;
    height: calc(100% - 26px);
    padding: 0 14px 8px;
    gap: 14px;
  }

  /* Stats column */
  .iv-stats {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
    border-right: 1px solid rgba(255,255,255,.22);
    padding-right: 14px;
  }
  .iv-stat-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    column-gap: 7px;
    padding: 4px 0 0;
  }
  .iv-stat-icon {
    font: 14px/1 'Material Symbols Rounded';
    color: var(--iv-dim);
    text-align: center;
  }
  .iv-stat-icon.on { color: var(--iv-text); }
  .iv-stat-lbl {
    font: 700 9px/1 Orbitron;
    letter-spacing: .12em;
    color: var(--iv-dim);
  }
  .iv-stat-val {
    font: 700 9px/1 Orbitron;
    color: var(--iv-muted);
    text-align: right;
  }
  .iv-stat-bar {
    grid-column: 2 / -1;
    height: 2px;
    background: rgba(255,255,255,.05);
    margin-top: 3px;
    overflow: hidden;
  }
  .iv-stat-fill {
    height: 100%;
    transition: width .3s ease;
  }

  /* Loadout */
  .iv-loadout {
    display: flex;
    align-items: center;
    gap: 18px;
    overflow: hidden;
  }

  /* Frame slot */
  .iv-frame-slot {
    flex-shrink: 0;
    width: 78px; height: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--iv-card);
    cursor: pointer;
    transition: background .15s;
    position: relative;
    user-select: none;
  }
  .iv-frame-slot:hover { background: var(--iv-card-hi); }
  .iv-frame-slot::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    transition: background .15s;
  }
  .iv-frame-slot.sel::after,
  .iv-frame-slot.pend::after { background: rgba(148,148,148,.75); }
  .iv-frame-slot.pend { background: rgba(151,151,151,.09); }
  .iv-fs-icon {
    font: 26px/1 'Material Symbols Rounded';
    color: #cccccc;
    transition: color .15s;
  }
  .iv-frame-slot.sel .iv-fs-icon,
  .iv-frame-slot.pend .iv-fs-icon { color: var(--iv-gold); }
  .iv-fs-name {
    font: 700 9px/1 Orbitron;
    color: var(--iv-dim);
    margin-top: 5px;
    letter-spacing: .07em;
    transition: color .15s;
  }
  .iv-frame-slot.sel .iv-fs-name,
  .iv-frame-slot.pend .iv-fs-name { color: var(--iv-muted); }
  .iv-fs-rar {
    font: 9px/1 Orbitron;
    margin-top: 2px;
    letter-spacing: .08em;
  }

  /* Core slots grid */
  .iv-cores-grid {
    display: grid;
    gap: 6px;
    align-content: center;
  }
  .iv-core-slot {
    width: 68px; height: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--iv-card);
    cursor: pointer;
    transition: background .15s;
    position: relative;
    user-select: none;
  }
  .iv-core-slot:hover { background: var(--iv-card-hi); }
  .iv-core-slot::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    transition: background .15s;
  }
  .iv-core-slot.sel::after { background: rgba(148,148,148,.7); }
  .iv-core-slot.pend::after { background: rgba(151,151,151,.7); }
  .iv-core-slot.pend { background: rgba(151,151,151,.07); }
  .iv-core-icon {
    font: 22px/1 'Material Symbols Rounded';
    color: var(--iv-dim);
    transition: color .15s;
  }
  .iv-slot-mult {
    position: absolute;
    bottom: 3px; left: 4px;
    font: 9px/1 Orbitron;
    color: var(--iv-dim);
  }
  .iv-core-name {
    font: 700 9px/1 Orbitron;
    color: var(--iv-dim);
    margin-top: 3px;
    transition: color .15s;
  }
  .iv-core-slot.sel .iv-core-name { color: var(--iv-muted); }

  /* ── Bottom row ── */
  .iv-bottom {
    display: grid;
    grid-template-columns: 30% 1fr;
    gap: var(--iv-gap);
  }

  /* Detail panel */
  #iv-det-body {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .iv-det-empty {
    margin-top: 38%;
    font: 9px/1 Orbitron;
    letter-spacing: .16em;
    color: var(--iv-dim);
  }
  .iv-det-icon { font: 38px/1 'Material Symbols Rounded'; margin-top: 14px; }
  .iv-det-name { font: 700 12px/1.2 Orbitron; color: var(--iv-text); margin-top: 7px; letter-spacing:.05em; text-align:center; }
  .iv-det-rar  { font: 9px/1 Orbitron; letter-spacing: .14em; margin-top: 4px; }
  .iv-divider  { width:60%; height:1px; background: linear-gradient(90deg,transparent,rgba(148,148,148,.38),transparent); margin: 10px 0; }
  .iv-det-eff  { font: 700 14px/1 Orbitron; letter-spacing:.04em; margin-bottom:2px; }
  .iv-det-sub  { font: 700 9px/1 Orbitron; letter-spacing:.14em; color:var(--iv-dim); margin:8px 0 4px; }
  .iv-det-bonus {
    width:100%; display:grid;
    grid-template-columns: 18px 1fr auto;
    align-items:center; gap:6px;
    padding: 5px 8px; margin-top:3px;
    background: rgba(255,255,255,.025);
  }
  .iv-det-bi  { font: 13px/1 'Material Symbols Rounded'; }
  .iv-det-bv  { font: 700 9.5px/1 Orbitron; text-align:right; }
  .iv-det-meta { width:100%; display:flex; justify-content:space-between; padding:3px 0; margin-top:3px; }
  .iv-det-ml   { font: 9px/1 Orbitron; color:var(--iv-dim); letter-spacing:.10em; }
  .iv-det-mv   { font: 700 10px/1 Orbitron; color:var(--iv-muted); }
  .iv-det-eq   { margin-top:8px; font:700 9px/1 Orbitron; letter-spacing:.12em; color:#a0a0a0; }
  .iv-mult-grid { display:grid; gap:2px; margin-top:6px; }
  .iv-mult-cell { display:flex; align-items:center; justify-content:center; font:700 8px/1 Orbitron; color:#ffffff; }

  /* Library panel */
  .iv-lib-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100% - 26px);
    padding: 0 8px 6px;
    gap: 10px;
  }
  .iv-lib-col { display:flex; flex-direction:column; overflow:hidden; }
  .iv-col-hd {
    font: 700 9px/1 Orbitron;
    letter-spacing: .15em;
    color: var(--iv-dim);
    padding: 6px 4px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.22);
    flex-shrink: 0;
    transition: color .15s;
    user-select: none;
  }
  .iv-col-hd.on { color: var(--iv-gold); }

  .iv-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 3px;
    padding: 4px 0;
    overflow-y: auto;
    scrollbar-width: none;
    align-content: start;
  }
  .iv-grid::-webkit-scrollbar { display:none; }

  /* Cards */
  .iv-card {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--iv-card);
    cursor: pointer;
    transition: background .12s, transform .12s;
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  .iv-card:hover { background: var(--iv-card-hi); transform: translateY(-1px); }
  .iv-card::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    opacity: 0;
    transition: opacity .15s;
  }
  .iv-card.sel { background: #505050; }
  .iv-card.sel::after { background: var(--iv-gold); opacity: .75; }
  .iv-card.eq::after  { background: #dddddd; opacity: .65; }
  .iv-rar-bar { position:absolute; top:0; left:0; right:0; height:2px; }
  .iv-card-icon { font: 17px/1 'Material Symbols Rounded'; }
  .iv-card-name {
    font: 700 9px/1 Orbitron; letter-spacing:.03em;
    color: var(--iv-dim); margin-top:3px;
    max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition: color .12s;
  }
  .iv-card.sel .iv-card-name { color: var(--iv-text); }
  .iv-card-val  { font: 700 9px/1 Orbitron; margin-top:1px; }
  .iv-card-rar  { font: 9px/1 Orbitron; letter-spacing:.07em; color:var(--iv-dim); margin-top:1px; }
  .iv-card.sel .iv-card-rar { opacity:.9; }
  .iv-card-eq   { position:absolute; top:3px; right:3px; font:700 9px/1 Orbitron; }
  .iv-empty {
    aspect-ratio: 1;
    display: flex; align-items:center; justify-content:center;
    background: #252525;
    font: 9px/1 Orbitron; color: var(--iv-dim);
  }


  .iv-panel { border: 1px solid #484848; }
  .iv-card, .iv-core-slot, .iv-frame-slot { box-shadow: inset 0 0 0 1px #4a4a4a; }
  .iv-card.sel, .iv-core-slot.sel, .iv-frame-slot.sel,
  .iv-core-slot.pend, .iv-frame-slot.pend {
    background: #505050;
    box-shadow: inset 0 0 0 2px #eeeeee;
  }
  .iv-card-val { color: #eeeeee; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="inv">
  <div class="iv-bg"></div>
  <div class="iv-win">

    <!-- TOP: EQUIPPED LOADOUT -->
    <div class="iv-panel">
      <div class="iv-hd">Equipped Loadout</div>
      <div class="iv-top-body">
        <div class="iv-stats" id="iv-stats"></div>
        <div class="iv-loadout" id="iv-loadout"></div>
      </div>
    </div>

    <!-- BOTTOM ROW -->
    <div class="iv-bottom">

      <!-- BOTTOM LEFT: ITEM DETAIL -->
      <div class="iv-panel">
        <div class="iv-hd">Item Detail</div>
        <div id="iv-det-body"></div>
      </div>

      <!-- BOTTOM RIGHT: INVENTORY -->
      <div class="iv-panel">
        <div class="iv-hd">Inventory</div>
        <div class="iv-lib-body">
          <div class="iv-lib-col">
            <div class="iv-col-hd" id="iv-fhd">FRAMES  0/20</div>
            <div class="iv-grid" id="iv-fgrid"></div>
          </div>
          <div class="iv-lib-col">
            <div class="iv-col-hd" id="iv-chd">CORES  0/20</div>
            <div class="iv-grid" id="iv-cgrid"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ── Core system definitions ───────────────────────────────────────────────────
const CORE_DEFS = [
  { type: 'bullet',     label: 'BULLET',    desc: '+1 shot' },
  { type: 'speed',      label: 'SPEED',     desc: '+20% speed' },
  { type: 'slash',      label: 'SLASH',     desc: '+15% slash range' },
  { type: 'orbit',      label: 'ORBIT',     desc: '+1 orbit' },
  { type: 'orbitspeed', label: 'ORBITSPD',  desc: '+orbit speed' },
  { type: 'shield',     label: 'SHIELD',    desc: '+guard' },
];
const RARITIES = [
  { id: 'common',    label: 'CMN', color: '#dddddd', weight: 60, mult: 1   },
  { id: 'rare',      label: 'RAR', color: '#60b4ff', weight: 25, mult: 1.5 },
  { id: 'epic',      label: 'EPC', color: '#c084fc', weight: 12, mult: 2   },
  { id: 'legendary', label: 'LGD', color: '#ffbf47', weight:  3, mult: 3   },
];

const FRAME_DEFS = [
  { cols: 1, rows: 2, label: '1×2' },
  { cols: 2, rows: 2, label: '2×2' },
  { cols: 2, rows: 3, label: '2×3' },
  { cols: 3, rows: 3, label: '3×3' },
];

// A fresh starter frame for reset/unequip; never share its mutable slot array.
function createStarterFrame() {
  return { cols: 2, rows: 2, label: "2×2", rarity: null, slotMults: [1, 1, 1, 1] };
}

</script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const TILE      = 9;          // dungeon tile size in pixels
const DW        = 180;        // dungeon width in tiles
const DH        = 135;        // dungeon height in tiles
const DOX       = -Math.floor(DW / 2) * TILE;  // dungeon world origin X
const DOY       = -Math.floor(DH / 2) * TILE;  // dungeon world origin Y
const CELL      = 11;         // enemy cell render size
const GAP       = 0;          // enemy cell gap (reserved)
const BLOCK     = 11;         // enemy cell grid stride
const SIZES     = [2, 3, 4, 5]; // enemy grid sizes to choose from
const MAX_CHARGE = 70;        // frames to reach full spin-slash charge
const DEADZONE  = 0.15;       // gamepad radial dead-zone threshold
const FRAME_MS  = 1000 / 60; // target frame duration
const CORE_ICON = { bullet:'target', speed:'sprint', slash:'swords', orbit:'orbit', orbitspeed:'bolt' };
const FRAME_ICON = 'grid_view';
function matIcon(name, size, ctx2) { ctx2.font = `${size}px 'Material Symbols Rounded'`; }

// ── Canvas & camera ──────────────────────────────────────────────────────────
let camX = 0, camY = 0, shake = 0, hitStop = 0;

// ── FPS tracking ─────────────────────────────────────────────────────────────
let fps = 0, fpsFrameCount = 0, fpsLastTime = performance.now();

// ── Input ────────────────────────────────────────────────────────────────────
const keys  = {};
const mouse = { x: 0, y: 0, realX: 0, realY: 0, held: false, hasMoved: false };
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'r' || e.key === 'R') spawnEnemy();
  if (e.key === '1') toggleSkill(1);
  if (e.key === '2') toggleSkill(2);
  if (e.key === '3') toggleSkill(3);
  if (e.key === '4') toggleSkill(4);
  if (e.key === 'Shift') doDodge();
  if (e.key === 'i' || e.key === 'I') { if (inventoryOpen) { pendingSlot = -1; closeInventory(); } else if (!invClosing) openInventory(); }
  if (e.key === 'Escape' && inventoryOpen) {
    if (pendingSlot >= 0) { pendingSlot = -1; invSection = 'slots'; }
    else if (pendingFrameSlot) { pendingFrameSlot = false; invSection = 'slots'; invRightCursor = -1; }
    else closeInventory();
  }

  // Inventory navigation
  if (inventoryOpen) {
    const fc = equippedFrame.cols, fr = equippedFrame.rows;

    const invNav = (dir) => {
      if (invSection === 'slots') {
        if (invRightCursor === -1) {
          if (dir === 'right') invRightCursor = 0;
        } else {
          const col = invRightCursor % fc, row = Math.floor(invRightCursor / fc);
          if (dir === 'left')  invRightCursor = col > 0 ? invRightCursor - 1 : -1;
          if (dir === 'right') invRightCursor = col < fc-1 ? invRightCursor + 1 : invRightCursor;
          if (dir === 'up')    invRightCursor = row > 0 ? invRightCursor - fc : invRightCursor;
          if (dir === 'down')  { if (row < fr-1) invRightCursor += fc; }
        }
      } else if (invSection === 'frames') {
        if (dir === 'up') {
          if (invFrameCursor >= invCPerRowFrames) invFrameCursor -= invCPerRowFrames;
          else if (!pendingFrameSlot) { invSection = 'slots'; }
        }
        if (dir === 'down')  invFrameCursor = Math.min(Math.max(0, frameInventory.length - 1), invFrameCursor + invCPerRowFrames);
        if (dir === 'left')  invFrameCursor = Math.max(0, invFrameCursor - 1);
        if (dir === 'right') {
          const col = invFrameCursor % invCPerRowFrames;
          if (col < invCPerRowFrames - 1 && invFrameCursor + 1 < frameInventory.length) invFrameCursor++;
          else if (!pendingFrameSlot) { invSection = 'cores'; }
        }
      } else { // 'cores'
        if (dir === 'up') {
          if (invLeftCursor >= invCPerRowCores) invLeftCursor -= invCPerRowCores;
          else if (pendingSlot < 0) invSection = 'slots';
        }
        if (dir === 'down')  invLeftCursor = Math.min(Math.max(0, coreInventory.length - 1), invLeftCursor + invCPerRowCores);
        if (dir === 'right') invLeftCursor = Math.min(Math.max(0, coreInventory.length - 1), invLeftCursor + 1);
        if (dir === 'left') {
          const col = invLeftCursor % invCPerRowCores;
          if (col > 0) invLeftCursor--;
          else if (pendingSlot < 0) invSection = 'frames';
        }
      }
    };

    if (e.key === 'ArrowUp')    { invNav('up');    e.preventDefault(); }
    if (e.key === 'ArrowDown')  { invNav('down');  e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { invNav('left');  e.preventDefault(); }
    if (e.key === 'ArrowRight') { invNav('right'); e.preventDefault(); }
    if (e.key === 'Tab') {
      if (invSection === 'slots') { invSection = 'frames'; }
      else if (invSection === 'frames') { invSection = 'cores'; pendingFrameSlot = false; }
      else { invSection = 'slots'; pendingFrameSlot = false; }
      e.preventDefault();
    }

    const doEquip = () => {
      if (invSection === 'frames') {
        const frame = frameInventory[invFrameCursor];
        if (!frame) return;
        equippedCores.forEach(c => { if (c) delete c.equippedSlot; });
        if (frame.isEquipped) {
          delete frame.isEquipped;
          equippedFrame = createStarterFrame();
        } else {
          if (equippedFrame && equippedFrame.isEquipped) delete equippedFrame.isEquipped;
          equippedFrame = frame; frame.isEquipped = true;
        }
        equippedCores.length = 0;
        resizeEquippedCores();
        pendingFrameSlot = false; invSection = 'slots'; invRightCursor = 0;
      } else if (invSection === 'cores') {
        // Enter on a core → equip into pending/selected slot, return to slots
        const core = coreInventory[invLeftCursor];
        if (!core) return;
        const targetSlot = pendingSlot >= 0 ? pendingSlot : invRightCursor;
        if (targetSlot < 0) return; // フレームスロット選択中はコア装備不可
        if (core.equippedSlot === targetSlot) {
          delete core.equippedSlot;
          equippedCores[targetSlot] = null;
        } else {
          if (core.equippedSlot !== undefined) equippedCores[core.equippedSlot] = null;
          if (equippedCores[targetSlot]) delete equippedCores[targetSlot].equippedSlot;
          equippedCores[targetSlot] = core;
          core.equippedSlot = targetSlot;
        }
        recalcEquip();
        invRightCursor = targetSlot;
        pendingSlot = -1;
        invSection = 'slots';
      } else if (invRightCursor === -1) {
        // フレームスロットでEnter → フレーム一覧に入って選択開始
        pendingFrameSlot = true; pendingSlot = -1;
        invSection = 'frames';
        if (invFrameCursor >= frameInventory.length) invFrameCursor = 0;
      } else {
        // Enter on a core slot → start pending (blink), jump to cores
        pendingSlot = invRightCursor;
        invSection = 'cores';
        if (invLeftCursor >= coreInventory.length) invLeftCursor = 0;
      }
    };

    if (e.key === 'Enter' || e.key === ' ') { doEquip(); e.preventDefault(); }
    if (e.key === 'x' || e.key === 'X' || e.key === 'Backspace') {
      if (invSection === 'frames' || pendingFrameSlot || (invSection === 'slots' && invRightCursor === -1)) {
        // フレームを外す → デフォルト2×2に戻す
        if (equippedFrame.rarity) {
          equippedCores.forEach(c => { if (c) delete c.equippedSlot; });
          if (equippedFrame.isEquipped) delete equippedFrame.isEquipped;
          equippedFrame = createStarterFrame();
          equippedCores.length = 0; resizeEquippedCores();
        }
        pendingFrameSlot = false; invSection = 'slots'; invRightCursor = -1;
      } else {
        // Unequip core from selected slot
        const uc = equippedCores[invRightCursor];
        if (uc) {
          delete uc.equippedSlot;
          equippedCores[invRightCursor] = null;
          recalcEquip();
        }
      }
      e.preventDefault();
    }
    invDirty = true;
  }
});

// ── Dungeon ───────────────────────────────────────────────────────────────────
let dungeon = [];
let dungeonRooms = [];

function tileAt(wx, wy) {
  const tx = Math.floor((wx - DOX) / TILE);
  const ty = Math.floor((wy - DOY) / TILE);
  if (tx < 0 || tx >= DW || ty < 0 || ty >= DH) return 999;
  return dungeon[ty][tx];
}

function damageWall(tx, ty, hitX, hitY, hitAngle = Math.random() * Math.PI * 2) {
  if (tx < 0 || tx >= DW || ty < 0 || ty >= DH) return;
  if (dungeon[ty][tx] <= 0 || dungeon[ty][tx] >= 999) return;
  dungeon[ty][tx]--;
  shake = Math.max(shake, 2);

  for (let i = 0; i < 2; i++) {
    const a = hitAngle + (Math.random() - 0.5) * 2.2;
    const spd = 3 + Math.random() * 8;
    shards.push({ x: hitX, y: hitY,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.3,
      life: 1, decay: 0.03 + Math.random()*0.02, isCore: false,
      size: 4 + Math.random() * 8 });
  }
  for (let i = 0; i < 2; i++) {
    const a = hitAngle + (Math.random() - 0.5) * 1.8;
    sparks.push({ x: hitX, y: hitY,
      vx: Math.cos(a)*(3+Math.random()*6), vy: Math.sin(a)*(3+Math.random()*6),
      life: 1, decay: 0.06+Math.random()*0.05, r: 1.5, isCore: false });
  }
}

function generateDungeon() {
  dungeon = [];
  for (let ty = 0; ty < DH; ty++) {
    dungeon[ty] = [];
    for (let tx = 0; tx < DW; tx++)
      dungeon[ty][tx] = (tx === 0 || tx === DW-1 || ty === 0 || ty === DH-1) ? 999 : 2;
  }

  dungeonRooms = [];
  for (let attempt = 0; attempt < 80; attempt++) {
    const rw = 18 + Math.floor(Math.random() * 26);
    const rh = 15 + Math.floor(Math.random() * 20);
    const rx = 6 + Math.floor(Math.random() * (DW - rw - 12));
    const ry = 6 + Math.floor(Math.random() * (DH - rh - 12));
    let ok = true;
    for (const r of dungeonRooms) {
      if (rx < r.x+r.w+6 && rx+rw+6 > r.x && ry < r.y+r.h+6 && ry+rh+6 > r.y) { ok=false; break; }
    }
    if (!ok) continue;
    for (let ty = ry; ty < ry+rh; ty++)
      for (let tx = rx; tx < rx+rw; tx++)
        dungeon[ty][tx] = 0;
    dungeonRooms.push({ x:rx, y:ry, w:rw, h:rh });
  }

  // Connect rooms with L-shaped corridors (9 tiles wide ≈ 63px)
  for (let i = 1; i < dungeonRooms.length; i++) {
    const a = dungeonRooms[i-1], b = dungeonRooms[i];
    const ax = Math.floor(a.x + a.w/2), ay = Math.floor(a.y + a.h/2);
    const bx = Math.floor(b.x + b.w/2), by = Math.floor(b.y + b.h/2);
    for (let tx = Math.min(ax,bx); tx <= Math.max(ax,bx); tx++)
      for (let dy = -4; dy <= 4; dy++)
        if (ay+dy >= 0 && ay+dy < DH) dungeon[ay+dy][tx] = 0;
    for (let ty = Math.min(ay,by); ty <= Math.max(ay,by); ty++)
      for (let dx = -4; dx <= 4; dx++)
        if (bx+dx >= 0 && bx+dx < DW) dungeon[ty][bx+dx] = 0;
  }

  if (dungeonRooms.length > 0) {
    const r = dungeonRooms[0];
    player.x = DOX + (r.x + r.w/2) * TILE;
    player.y = DOY + (r.y + r.h/2) * TILE;
  }
}

function resolveWall(obj, radius) {
  if (!dungeon.length) return;
  const txMin = Math.floor((obj.x - radius - DOX) / TILE);
  const txMax = Math.floor((obj.x + radius - DOX) / TILE);
  const tyMin = Math.floor((obj.y - radius - DOY) / TILE);
  const tyMax = Math.floor((obj.y + radius - DOY) / TILE);
  for (let ty = tyMin; ty <= tyMax; ty++) {
    for (let tx = txMin; tx <= txMax; tx++) {
      const hp = (tx < 0 || tx >= DW || ty < 0 || ty >= DH) ? 999 : dungeon[ty][tx];
      if (hp <= 0) continue;
      const wx = DOX + tx * TILE, wy = DOY + ty * TILE;
      const overR = (obj.x + radius) - wx;
      const overL = (wx + TILE) - (obj.x - radius);
      const overB = (obj.y + radius) - wy;
      const overT = (wy + TILE) - (obj.y - radius);
      if (overR > 0 && overL > 0 && overB > 0 && overT > 0) {
        if (Math.min(overR, overL) < Math.min(overB, overT)) {
          if (overR < overL) { obj.x -= overR; if (obj.vx > 0) obj.vx = 0; }
          else               { obj.x += overL; if (obj.vx < 0) obj.vx = 0; }
        } else {
          if (overB < overT) { obj.y -= overB; if (obj.vy > 0) obj.vy = 0; }
          else               { obj.y += overT; if (obj.vy < 0) obj.vy = 0; }
        }
      }
    }
  }
}

// ── Enemy grid helpers ────────────────────────────────────────────────────────
function makeGrid(cols, rows) {
  const cc = Math.floor(cols / 2), cr = Math.floor(rows / 2);
  const spread = cols >= 4 ? 1 : 0;
  const coreC = cc + Math.floor(Math.random() * (spread*2+1)) - spread;
  const coreR = cr + Math.floor(Math.random() * (spread*2+1)) - spread;
  const g = [];
  for (let r = 0; r < rows; r++) {
    g[r] = [];
    for (let c = 0; c < cols; c++)
      g[r][c] = { alive: true, isCore: r === coreR && c === coreC };
  }
  return g;
}

// ── Gamepad rumble ────────────────────────────────────────────────────────────
function rumble(strong, weak, duration) {
  const allP = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
  // mainPadIndex 優先、なければ接続されている最初のパッドを使う
  const candidates = allP.filter(p => p?.connected);
  const pad = (gp.mainPadIndex >= 0 ? allP[gp.mainPadIndex] : null) ?? candidates[0];
  if (!pad?.vibrationActuator) return;
  const act = pad.vibrationActuator;
  const params = { startDelay: 0, duration, strongMagnitude: strong, weakMagnitude: weak };
  // dual-rumble (Chrome標準) → 失敗したら trigger-rumble (一部PS系) を試みる
  act.playEffect('dual-rumble', params).catch(() => {
    act.playEffect('trigger-rumble', params).catch(() => {});
  });
}

// ── Enemy spawn ───────────────────────────────────────────────────────────────
function spawnEnemy() {
  const n = SIZES[Math.floor(Math.random() * SIZES.length)];
  let ex, ey, placed = false;

  if (dungeon.length) {
    // Collect all walkable floor tiles that are far enough from player and other enemies
    const minDistSq = 200 * 200;
    const candidates = [];
    for (let ty = 1; ty < DH - 1; ty++) {
      for (let tx = 1; tx < DW - 1; tx++) {
        if (dungeon[ty][tx] !== 0) continue; // walls only on floor tiles
        const wx = DOX + (tx + 0.5) * TILE;
        const wy = DOY + (ty + 0.5) * TILE;
        const distSq = (wx - player.x) ** 2 + (wy - player.y) ** 2;
        if (distSq < minDistSq) continue;
        candidates.push([wx, wy]);
      }
    }
    // Shuffle and pick first that doesn't overlap existing enemies
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    for (const [cx, cy] of candidates) {
      if (!enemies.some(e => e.alive && Math.hypot(cx - e.x, cy - e.y) < n * BLOCK + 20)) {
        ex = cx; ey = cy; placed = true; break;
      }
    }
  }

  if (!placed) {
    // Fallback for open stage (no dungeon): angle-based from player
    const sxMin = DOX + TILE * 2, sxMax = DOX + (DW - 2) * TILE;
    const syMin = DOY + TILE * 2, syMax = DOY + (DH - 2) * TILE;
    const a = Math.random() * Math.PI * 2;
    ex = Math.max(sxMin, Math.min(sxMax, player.x + Math.cos(a) * (240 + Math.random() * 180)));
    ey = Math.max(syMin, Math.min(syMax, player.y + Math.sin(a) * (240 + Math.random() * 180)));
  }

  enemies.push({ x: ex, y: ey, vx: 0, vy: 0, cols: n, rows: n,
    grid: makeGrid(n, n), angle: 0, hitFlash: 0, coreFlash: 0,
    blinkT: Math.random() * Math.PI * 2, alive: true,
    alpha: 0, repairTimer: 360,
    coreMoveTimer: 480 + Math.floor(Math.random() * 240) });
}

// ── Slash actions ─────────────────────────────────────────────────────────────
function doSlash() {
  if (player.slashCooldown > 0) return;

  // Scale arc, dash, and radius based on charge fraction
  const frac = Math.min(player.chargeTime / (MAX_CHARGE - 1), 1);
  const arcHalf = 0.7  + frac * 0.9;   // arc half-angle 0.7→1.6 rad
  const dashSpd  = 7   + frac * 9;     // forward impulse 7→16 px
  const radius   = (55 + frac * 50) * equipStats.slashMult;  // hit radius scaled by slash cores

  player.slashCooldown = Math.round(10 + frac * 14);

  player.vx += Math.cos(player.angle) * dashSpd;
  player.vy += Math.sin(player.angle) * dashSpd;
  shake = Math.max(shake, 4 + frac * 9);

  const arcCenter = player.angle;
  const arcFrom   = arcCenter - arcHalf;
  const arcTo     = arcCenter + arcHalf;
  const hitStyle  = frac < 0.4 ? 0 : frac < 0.75 ? 1 : 2;

  // Offset slash origin forward so the player doesn't outrun it on dash
  const fwdOff = 22 + frac * 20;
  const slashX = player.x + Math.cos(player.angle) * fwdOff;
  const slashY = player.y + Math.sin(player.angle) * fwdOff;

  slashes.push({
    x: slashX, y: slashY,
    arcFrom, arcTo,
    r: radius,
    hit: hitStyle,
    life: 1,
    decay: 0.07 - frac * 0.02,
  });

  // Hit arc sector + unconditional melee circle at player origin
  const fullRadius = fwdOff + radius;
  const meleeR = 26;
  for (const e of enemies) {
    if (!e.alive) continue;
    const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
    const wcos = Math.cos(e.angle), wsin = Math.sin(e.angle);
    for (let r = 0; r < e.rows; r++) {
      for (let c = 0; c < e.cols; c++) {
        if (!e.grid[r][c].alive) continue;
        const ox = -gw/2, oy = -gh/2;
        const lcx = ox + c*BLOCK + CELL/2, lcy = oy + r*BLOCK + CELL/2;
        const wx = e.x + wcos*lcx - wsin*lcy;
        const wy = e.y + wsin*lcx + wcos*lcy;
        const dx = wx - player.x, dy = wy - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist <= meleeR) { chipEnemy(e, wx, wy); continue; }
        if (dist > fullRadius) continue;
        let diff = Math.atan2(dy, dx) - arcCenter;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) <= arcHalf) chipEnemy(e, wx, wy);
      }
    }
  }

  slashWalls(player.x, player.y, arcCenter, arcHalf, fullRadius);

  const steps = 8 + Math.round(frac * 6);
  for (let i = 0; i <= steps; i++) {
    const a = arcFrom + (arcTo - arcFrom) * (i / steps);
    const d = radius * (0.5 + Math.random() * 0.5);
    sparks.push({
      x: slashX + Math.cos(a) * d, y: slashY + Math.sin(a) * d,
      vx: Math.cos(a) * (1 + Math.random() * 3), vy: Math.sin(a) * (1 + Math.random() * 3),
      life: 1, decay: 0.05 + Math.random() * 0.05,
      r: 1.8 + frac * 0.7, isCore: false,
    });
  }
}

function doSpinSlash() {
  if (player.slashCooldown > 0) return;
  player.slashCooldown = 40;
  shake = Math.max(shake, 14);

  const R = Math.round(110 * equipStats.slashMult);

  for (const e of enemies) {
    if (!e.alive) continue;
    const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
    const wcos = Math.cos(e.angle), wsin = Math.sin(e.angle);
    for (let r = 0; r < e.rows; r++) {
      for (let c = 0; c < e.cols; c++) {
        if (!e.grid[r][c].alive) continue;
        const ox = -gw/2, oy = -gh/2;
        const lcx = ox + c*BLOCK + CELL/2, lcy = oy + r*BLOCK + CELL/2;
        const wx = e.x + wcos*lcx - wsin*lcy;
        const wy = e.y + wsin*lcx + wcos*lcy;
        if (Math.hypot(wx - player.x, wy - player.y) <= R) {
          chipEnemy(e, wx, wy);
          // Extra outward knockback from player center
          const sd = Math.hypot(e.x - player.x, e.y - player.y) || 1;
          e.vx += ((e.x - player.x) / sd) * 1.5;
          e.vy += ((e.y - player.y) / sd) * 1.5;
        }
      }
    }
  }

  slashWalls(player.x, player.y, 0, Math.PI, R);

  const steps = 24;
  for (let i = 0; i < steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    const d = R * (0.5 + Math.random() * 0.5);
    sparks.push({
      x: player.x + Math.cos(a) * d,
      y: player.y + Math.sin(a) * d,
      vx: Math.cos(a) * (2 + Math.random() * 4),
      vy: Math.sin(a) * (2 + Math.random() * 4),
      life: 1, decay: 0.025 + Math.random() * 0.025,
      r: 2.5, isCore: false,
    });
  }

  slashes.push({
    x: player.x, y: player.y,
    arcFrom: 0, arcTo: Math.PI * 2,
    r: R, hit: 'spin',
    life: 1, decay: 0.035,
    spinAngle: player.angle,
  });
}

// ── Dodge ────────────────────────────────────────────────────────────────────
function doDodge() {
  if (player.dodgeCooldown > 0) return;
  const spd = Math.hypot(player.vx, player.vy);
  const dx = spd > 0.5 ? player.vx / spd : Math.cos(player.angle);
  const dy = spd > 0.5 ? player.vy / spd : Math.sin(player.angle);
  player.vx += dx * 22;
  player.vy += dy * 22;
  player.dodgeCooldown = 45;
  player.dodgeTimer = 16;
  shake = Math.max(shake, 3);
  for (let i = 0; i < 8; i++) {
    const a = Math.atan2(-dy, -dx) + (Math.random() - 0.5) * 1.2;
    sparks.push({ x: player.x, y: player.y,
      vx: Math.cos(a) * (2 + Math.random() * 4), vy: Math.sin(a) * (2 + Math.random() * 4),
      life: 1, decay: 0.06 + Math.random() * 0.05, r: 1.5, isCore: false });
  }
}

// ── Orb spawn ────────────────────────────────────────────────────────────────
function spawnOrb(x, y, count = 1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3;
    const roll  = Math.random();
    const value = roll < 0.65 ? 1 : roll < 0.90 ? 5 : 10;
    const r     = value === 1 ? 3.5 : value === 5 ? 5.5 : 8.5;
    orbs.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      r, value,
      phase: Math.random() * Math.PI * 2,
      timer: 180,
    });
  }
}

function spawnGoldBurst(x, y, value) {
  const count = value === 1 ? 7 : value === 5 ? 14 : 22;
  const spdMax = value === 1 ? 2.8 : value === 5 ? 4.2 : 6.0;
  const szMax  = value === 1 ? 2.2 : value === 5 ? 3.2 : 4.5;
  for (let i = 0; i < count; i++) {
    const a   = Math.random() * Math.PI * 2;
    const spd = 0.8 + Math.random() * spdMax;
    goldBursts.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      rot:  Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.55,
      size: 1.0 + Math.random() * szMax,
      life: 1.0,
      decay: 0.035 + Math.random() * 0.045,
    });
  }
}

// ── Core helpers ─────────────────────────────────────────────────────────────
function rollStatValue(type, rarityIdx) {
  const t = Math.random();
  if (type === 'bullet') {
    const bases = [1, 1, 2, 3], maxes = [1, 2, 3, 5];
    return Math.max(1, Math.round(bases[rarityIdx] + t * (maxes[rarityIdx] - bases[rarityIdx])));
  }
  if (type === 'speed') {
    const bases = [0.10, 0.18, 0.25, 0.35], maxes = [0.20, 0.32, 0.45, 0.62];
    return Math.round((bases[rarityIdx] + t * (maxes[rarityIdx] - bases[rarityIdx])) * 100) / 100;
  }
  if (type === 'slash') {
    const bases = [0.08, 0.14, 0.20, 0.28], maxes = [0.18, 0.28, 0.40, 0.55];
    return Math.round((bases[rarityIdx] + t * (maxes[rarityIdx] - bases[rarityIdx])) * 100) / 100;
  }
  if (type === 'orbit') {
    const bases = [1, 1, 2, 2], maxes = [1, 2, 3, 4];
    return Math.max(1, Math.round(bases[rarityIdx] + t * (maxes[rarityIdx] - bases[rarityIdx])));
  }
  if (type === 'orbitspeed') {
    const bases = [0.10, 0.20, 0.30, 0.45], maxes = [0.20, 0.35, 0.55, 0.80];
    return Math.round((bases[rarityIdx] + t * (maxes[rarityIdx] - bases[rarityIdx])) * 100) / 100;
  }
  return 1;
}

function rollBonusValue(type) {
  const t = Math.random();
  if (type === 'bullet')     return 1;
  if (type === 'speed')      return Math.round((0.04 + t * 0.12) * 100) / 100;
  if (type === 'slash')      return Math.round((0.03 + t * 0.10) * 100) / 100;
  if (type === 'orbit')      return 1;
  if (type === 'orbitspeed') return Math.round((0.05 + t * 0.15) * 100) / 100;
  return 0;
}

function coreEffStr(type, value) {
  if (type === 'bullet')     return `+${Math.round(value)} SHOT`;
  if (type === 'speed')      return `+${Math.round(value * 100)}% SPD`;
  if (type === 'slash')      return `+${Math.round(value * 100)}% SLH`;
  if (type === 'orbit')      return `+${Math.ceil(value)} ORB`;
  if (type === 'orbitspeed') return `+${Math.round(value * 100)}% OSPD`;
  return '—';
}

function rollCore() {
  let roll = Math.random() * 100, acc = 0;
  let rarity = RARITIES[0], rarityIdx = 0;
  for (let i = 0; i < RARITIES.length; i++) {
    acc += RARITIES[i].weight;
    if (roll < acc) { rarity = RARITIES[i]; rarityIdx = i; break; }
  }
  const def = CORE_DEFS[Math.floor(Math.random() * CORE_DEFS.length)];
  const value = rollStatValue(def.type, rarityIdx);

  // bonus affixes: 0 for common, 0-1 for rare, 1-2 for epic, 2-3 for legendary
  const bonusCounts = [0, 1, 2, 3];
  const bonusMin    = [0, 0, 1, 2];
  const nBonuses = bonusMin[rarityIdx] + Math.floor(Math.random() * (bonusCounts[rarityIdx] - bonusMin[rarityIdx] + 1));
  const otherDefs = CORE_DEFS.filter(d => d.type !== def.type);
  const bonuses = [];
  const usedTypes = new Set();
  for (let i = 0; i < nBonuses && otherDefs.length > 0; i++) {
    const available = otherDefs.filter(d => !usedTypes.has(d.type));
    if (!available.length) break;
    const bd = available[Math.floor(Math.random() * available.length)];
    usedTypes.add(bd.type);
    bonuses.push({ type: bd.type, label: bd.label, value: rollBonusValue(bd.type) });
  }

  return { ...def, rarity, value, bonuses };
}

function applyCoreStat(type, value) {
  if (type === 'bullet')     equipStats.bulletBonus  += Math.round(value);
  if (type === 'speed')      equipStats.speedMult    += value;
  if (type === 'slash')      equipStats.slashMult    += value;
  if (type === 'orbit')      equipStats.extraOrbits  += Math.ceil(value);
  if (type === 'orbitspeed') equipStats.orbitSpeedMult += value;
}

function recalcEquip() {
  equipStats.bulletBonus   = 0;
  equipStats.speedMult     = 1.0;
  equipStats.slashMult     = 1.0;
  equipStats.extraOrbits   = 0;
  equipStats.orbitSpeedMult = 1.0;
  for (let si = 0; si < equippedCores.length; si++) {
    const c = equippedCores[si];
    if (!c) continue;
    const slotMult = equippedFrame.slotMults?.[si] ?? 1.0;
    applyCoreStat(c.type, (c.value ?? c.rarity.mult) * slotMult);
    for (const b of (c.bonuses ?? [])) applyCoreStat(b.type, b.value * slotMult);
  }
}

function resizeEquippedCores() {
  const total = equippedFrame.cols * equippedFrame.rows;
  // excess cores back to inventory
  while (equippedCores.length > total) {
    const c = equippedCores.pop();
    if (c) delete c.equippedSlot;
  }
  while (equippedCores.length < total) equippedCores.push(null);
  recalcEquip();
}

function dropCore(wx, wy) {
  const core = rollCore();
  const a = Math.random() * Math.PI * 2;
  const spd = 1.5 + Math.random() * 2.5;
  drops.push({
    x: wx, y: wy,
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
    phase: Math.random() * Math.PI * 2,
    timer: 480,
    kind: 'core',
    data: core,
  });
}

function dropFrame(wx, wy) {
  let roll = Math.random() * 100, acc = 0;
  let rarity = RARITIES[0];
  for (const r of RARITIES) { acc += r.weight; if (roll < acc) { rarity = r; break; } }
  const def = FRAME_DEFS[Math.floor(Math.random() * FRAME_DEFS.length)];
  const slotCount = def.cols * def.rows;
  const slotMults = Array.from({ length: slotCount }, () => Math.round((1.0 + Math.random()) * 10) / 10);
  const a = Math.random() * Math.PI * 2;
  const spd = 1.2 + Math.random() * 2;
  drops.push({
    x: wx, y: wy,
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
    phase: Math.random() * Math.PI * 2,
    timer: 600,
    kind: 'frame',
    data: { ...def, rarity, slotMults },
  });
}

// ── Shooting ──────────────────────────────────────────────────────────────────
function fireBullet(a) {
  const tip = player.tipOffset;
  bullets.push({
    x: player.x + Math.cos(a) * tip,
    y: player.y + Math.sin(a) * tip,
    vx: Math.cos(a) * 18, vy: Math.sin(a) * 18,
    prev: null,
  });
}

function tryShoot() {
  if (player.cooldown > 0) return;
  const a = Math.atan2(mouse.y - H/2, mouse.x - W/2);
  if (activeSkills.has(4)) {
    fireBullet(a - 0.44); fireBullet(a - 0.22); fireBullet(a);
    fireBullet(a + 0.22); fireBullet(a + 0.44);
  } else if (activeSkills.has(1)) {
    fireBullet(a - 0.22); fireBullet(a); fireBullet(a + 0.22);
  } else {
    fireBullet(a);
  }
  for (let bi = 1; bi <= equipStats.bulletBonus; bi++) {
    fireBullet(a + 0.18 * bi);
    fireBullet(a - 0.18 * bi);
  }
  const cd = activeSkills.has(3) ? (activeSkills.has(4) ? 6 : 3) : activeSkills.has(4) ? 13 : 9;
  player.cooldown = cd;
  player.muzzle = 7;
  shake = Math.max(shake, 3.5);
  for (let i = 0; i < 5; i++) {
    const sa = a + (Math.random() - 0.5) * 0.5;
    sparks.push({
      x: player.x + Math.cos(a) * player.tipOffset,
      y: player.y + Math.sin(a) * player.tipOffset,
      vx: Math.cos(sa) * (5 + Math.random() * 5),
      vy: Math.sin(sa) * (5 + Math.random() * 5),
      life: 1, decay: 0.15, r: 2, isCore: false,
    });
  }
}

// ── Enemy hit logic ───────────────────────────────────────────────────────────
function chipEnemy(e, bx, by) {
  const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
  const ldx = bx - e.x, ldy = by - e.y;
  const cos = Math.cos(-e.angle), sin = Math.sin(-e.angle);
  const lx = cos*ldx - sin*ldy, ly = sin*ldx + cos*ldy;
  const ox = -gw/2, oy = -gh/2;
  const fc = Math.round((lx - ox) / BLOCK - 0.5);
  const fr = Math.round((ly - oy) / BLOCK - 0.5);

  let best = null, bestD = Infinity;
  for (let dr = -2; dr <= 2; dr++) {
    for (let dc = -2; dc <= 2; dc++) {
      const r = fr+dr, c = fc+dc;
      if (r < 0 || r >= e.rows || c < 0 || c >= e.cols) continue;
      if (!e.grid[r][c].alive) continue;
      const cx = ox + c*BLOCK + CELL/2, cy = oy + r*BLOCK + CELL/2;
      const d = (lx-cx)**2 + (ly-cy)**2;
      if (d < bestD) { bestD = d; best = { r, c, cx, cy }; }
    }
  }
  if (!best) return false;

  const cell = e.grid[best.r][best.c];
  cell.alive = false;
  e.hitFlash = 6;
  e.repairTimer = 360;

  // Knockback: push enemy away from hit point
  const kbDist = Math.hypot(e.x - bx, e.y - by) || 1;
  const kbStr  = cell.isCore ? 2.0 : 0.9;
  e.vx += ((e.x - bx) / kbDist) * kbStr;
  e.vy += ((e.y - by) / kbDist) * kbStr;

  const wcos = Math.cos(e.angle), wsin = Math.sin(e.angle);
  const wx = e.x + wcos*best.cx - wsin*best.cy;
  const wy = e.y + wsin*best.cx + wcos*best.cy;

  const hitAngle = Math.atan2(wy - by, wx - bx);
  const shardCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < shardCount; i++) {
    const a = hitAngle + (Math.random() - 0.5) * 1.6;
    const spd = 6 + Math.random() * 10;
    const sz  = CELL * (0.5 + Math.random() * 0.8);
    shards.push({ x: wx, y: wy,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.35,
      life: 1, decay: 0.022 + Math.random() * 0.018,
      isCore: cell.isCore, size: sz, fromEnemy: true });
  }

  for (let i = 0; i < 14; i++) {
    const sa = i < 9
      ? hitAngle + (Math.random() - 0.5) * 2.0   // forward fan
      : Math.random() * Math.PI * 2;               // ambient scatter
    const spd = i < 9 ? 4 + Math.random() * 9 : 1 + Math.random() * 3;
    sparks.push({ x: wx, y: wy,
      vx: Math.cos(sa) * spd, vy: Math.sin(sa) * spd,
      life: 1, decay: 0.04 + Math.random() * 0.05,
      r: i < 9 ? 2.5 : 1.2, isCore: cell.isCore });
  }

  shake = Math.max(shake, cell.isCore ? 12 : 6);

  if (cell.isCore) {
    spawnOrb(wx, wy, 6 + Math.floor(Math.random() * 5));
    e.coreFlash = 15;
    hitStop = 5;
    blastWalls(wx, wy, 90);
    blastNearbyEnemies(wx, wy, 150);
    setTimeout(() => killEnemy(e), 80);
    rumble(0.35, 0.6, 180);
    dropCore(wx, wy);
    if (Math.random() < 0.25) dropFrame(wx, wy);
    return 'core';
  } else {
    spawnOrb(wx, wy, 1);
    rumble(0, 0.3, 55);       // 通常ヒット: 振動細
  }

  return true;
}

function slashWalls(originX, originY, arcCenter, arcHalf, radius) {
  const txMin = Math.floor((originX - radius - DOX) / TILE);
  const txMax = Math.floor((originX + radius - DOX) / TILE);
  const tyMin = Math.floor((originY - radius - DOY) / TILE);
  const tyMax = Math.floor((originY + radius - DOY) / TILE);
  for (let ty = tyMin; ty <= tyMax; ty++) {
    for (let tx = txMin; tx <= txMax; tx++) {
      if (tx < 0 || tx >= DW || ty < 0 || ty >= DH) continue;
      if (dungeon[ty][tx] <= 0 || dungeon[ty][tx] >= 999) continue;
      const twx = DOX + (tx + 0.5) * TILE, twy = DOY + (ty + 0.5) * TILE;
      if (Math.hypot(twx - originX, twy - originY) > radius) continue;
      const ang = Math.atan2(twy - originY, twx - originX);
      if (arcHalf < Math.PI) {
        let diff = ang - arcCenter;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) > arcHalf) continue;
      }
      damageWall(tx, ty, twx, twy, ang);
    }
  }
}

function blastNearbyEnemies(cx, cy, radius) {
  for (const target of enemies) {
    if (!target.alive) continue;
    const gw = target.cols * BLOCK, gh = target.rows * BLOCK;
    const enemyDist = Math.hypot(target.x - cx, target.y - cy);
    if (enemyDist > radius + Math.max(gw, gh)) continue;
    // Effective damage radius shrinks with distance: close enemies take full blast,
    // far enemies only lose outer cells (core stays safe unless very close)
    const hitR = radius * Math.max(0, 1 - enemyDist / radius * 0.85);
    if (hitR <= 0) continue;
    const cos = Math.cos(target.angle), sin = Math.sin(target.angle);
    const kd = enemyDist || 1;
    let anyHit = false;
    for (let r = 0; r < target.rows; r++) {
      for (let c = 0; c < target.cols; c++) {
        const cell = target.grid[r][c];
        if (!cell.alive) continue;
        const lx = -gw/2 + c*BLOCK + CELL/2;
        const ly = -gh/2 + r*BLOCK + CELL/2;
        const wx = target.x + cos*lx - sin*ly;
        const wy = target.y + sin*lx + cos*ly;
        if (Math.hypot(wx - cx, wy - cy) > hitR) continue;
        cell.alive = false;
        anyHit = true;
        target.repairTimer = 360;
        const ha = Math.atan2(wy - cy, wx - cx);
        for (let i = 0; i < 4; i++) {
          const a = ha + (Math.random() - 0.5) * Math.PI;
          sparks.push({ x: wx, y: wy,
            vx: Math.cos(a)*(3+Math.random()*7), vy: Math.sin(a)*(3+Math.random()*7),
            life: 1, decay: 0.05+Math.random()*0.04, r: 1.5, isCore: cell.isCore });
        }
        shards.push({ x: wx, y: wy,
          vx: Math.cos(Math.atan2(wy-cy,wx-cx))*(4+Math.random()*6),
          vy: Math.sin(Math.atan2(wy-cy,wx-cx))*(4+Math.random()*6),
          rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.3,
          life: 1, decay: 0.025+Math.random()*0.02, isCore: cell.isCore,
          size: CELL*(0.4+Math.random()*0.6), fromEnemy: true });
        if (cell.isCore) {
          spawnOrb(wx, wy, 6 + Math.floor(Math.random() * 5));
          target.coreFlash = 15;
          blastWalls(wx, wy, 70);
          dropCore(wx, wy);
          if (Math.random() < 0.25) dropFrame(wx, wy);
          setTimeout(() => killEnemy(target), 80);
        }
      }
    }
    if (anyHit) {
      target.hitFlash = 6;
      target.vx += ((target.x - cx) / kd) * 1.8;
      target.vy += ((target.y - cy) / kd) * 1.8;
    }
  }
}

function blastWalls(cx, cy, radius) {
  const txMin = Math.floor((cx - radius - DOX) / TILE);
  const txMax = Math.floor((cx + radius - DOX) / TILE);
  const tyMin = Math.floor((cy - radius - DOY) / TILE);
  const tyMax = Math.floor((cy + radius - DOY) / TILE);
  for (let ty = tyMin; ty <= tyMax; ty++) {
    for (let tx = txMin; tx <= txMax; tx++) {
      if (tx < 0 || tx >= DW || ty < 0 || ty >= DH) continue;
      if (dungeon[ty][tx] <= 0 || dungeon[ty][tx] >= 999) continue;
      const twx = DOX + (tx + 0.5) * TILE, twy = DOY + (ty + 0.5) * TILE;
      const dist = Math.hypot(twx - cx, twy - cy);
      if (dist > radius) continue;
      const hitA = Math.atan2(twy - cy, twx - cx);
      dungeon[ty][tx] = 0;
      const frac = 1 - dist / radius;
      for (let i = 0; i < 3; i++) {
        const a = hitA + (Math.random() - 0.5) * 2.2;
        const spd = (4 + Math.random() * 9) * (0.6 + frac * 0.8);
        shards.push({ x: twx, y: twy, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
          rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.3,
          life: 1, decay: 0.018 + Math.random()*0.014, isCore: false,
          size: 5 + Math.random() * 9 });
      }
      for (let i = 0; i < 3; i++) {
        const a = hitA + (Math.random() - 0.5) * 2.0;
        sparks.push({ x: twx, y: twy,
          vx: Math.cos(a)*(3+Math.random()*6), vy: Math.sin(a)*(3+Math.random()*6),
          life: 1, decay: 0.04+Math.random()*0.04, r: 1.5, isCore: false });
      }
    }
  }
}

function killEnemy(e) {
  if (!e.alive) return;
  e.alive = false;
  shake = Math.max(shake, 14);
  setTimeout(spawnEnemy, 1800 + Math.random() * 1200);
  const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
  for (let r = 0; r < e.rows; r++) {
    for (let c = 0; c < e.cols; c++) {
      if (!e.grid[r][c].alive) continue;
      const ox = -gw/2, oy = -gh/2;
      const lcx = ox + c*BLOCK + CELL/2, lcy = oy + r*BLOCK + CELL/2;
      const wcos = Math.cos(e.angle), wsin = Math.sin(e.angle);
      const wx = e.x + wcos*lcx - wsin*lcy, wy = e.y + wsin*lcx + wcos*lcy;
      const a = Math.atan2(lcy, lcx) + (Math.random()-0.5)*0.8;
      const s = 5 + Math.random() * 10;
      shards.push({ x: wx, y: wy, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.25,
        life: 1, decay: 0.01+Math.random()*0.02, isCore: e.grid[r][c].isCore, size: CELL, fromEnemy: true });
    }
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
generateDungeon();
for (let i = 0; i < 6; i++) spawnEnemy();

</script>
<script>
// ════════════════════════════════════════════════════════════
//  INVENTORY DOM RENDERER

function renderInvDOM() {
  // ── Stats ──────────────────────────────────────────────────
  const stDefs = [
    { label:'BULLET', icon:'target',  color:'#dddddd', val:equipStats.bulletBonus,      max:6,   txt:equipStats.bulletBonus>0?`+${equipStats.bulletBonus}`:'—' },
    { label:'SPEED',  icon:'sprint',  color:'#cfcfcf', val:equipStats.speedMult-1,      max:1.5, txt:equipStats.speedMult>1?`+${Math.round((equipStats.speedMult-1)*100)}%`:'—' },
    { label:'SLASH',  icon:'swords',  color:'#dddddd', val:equipStats.slashMult-1,      max:1.5, txt:equipStats.slashMult>1?`+${Math.round((equipStats.slashMult-1)*100)}%`:'—' },
    { label:'ORBITS', icon:'orbit',   color:'#dddddd', val:equipStats.extraOrbits,      max:4,   txt:equipStats.extraOrbits>0?`+${equipStats.extraOrbits}`:'—' },
