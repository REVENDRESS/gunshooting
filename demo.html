<script>
// ── Update sub-functions ──────────────────────────────────────────────────────

function updateInput(dt) {
  const inventoryBefore = JSON.stringify([inventoryOpen, invSection, invRightCursor,
    invFrameCursor, invLeftCursor, pendingSlot, pendingFrameSlot]);
  const allP = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];

  // Left stick: pick the pad with the most input; require >0.3 to set as main
  {
    let bestLx = 0, bestLy = 0;
    for (const p of allP) {
      if (!p || !p.connected) continue;
      const { x: lx, y: ly } = radialDeadzone(p.axes[0] || 0, p.axes[1] || 0);
      const mag = Math.hypot(lx, ly);
      if (mag > Math.hypot(bestLx, bestLy)) { bestLx = lx; bestLy = ly; }
      if (mag > 0.3) gp.mainPadIndex = p.index;
      // スティック未使用でもボタン入力があればメインパッドとして登録
      if (gp.mainPadIndex < 0 && p.buttons.some(b => b.pressed)) gp.mainPadIndex = p.index;
    }
    if (!inventoryOpen && !invClosing && Math.hypot(bestLx, bestLy) > 0) {
      keys['_gpL'] = true;
      player.vx = player.vx * Math.pow(0.75, dt) + bestLx * 3.8 * equipStats.speedMult * (1 - Math.pow(0.75, dt));
      player.vy = player.vy * Math.pow(0.75, dt) + bestLy * 3.8 * equipStats.speedMult * (1 - Math.pow(0.75, dt));
    } else {
      keys['_gpL'] = false;
    }
  }

  // Right stick: read only from the confirmed main pad (avoids drift from other pads)
  {
    const src = gp.mainPadIndex >= 0 ? allP[gp.mainPadIndex] : null;
    if (src) {
      const { x: rx, y: ry } = radialDeadzone(src.axes[2] || 0, src.axes[3] || 0);
      if (Math.hypot(rx, ry) > 0) {
        const angle = Math.atan2(ry, rx);
        player.angle = angle;
        mouse.x = W / 2 + Math.cos(angle) * 160;
        mouse.y = H / 2 + Math.sin(angle) * 160;
        gp.aimActive = true;
      } else {
        gp.aimActive = false;
      }
    } else {
      gp.aimActive = false;
    }
  }

  // Buttons: scan every connected pad
  {
    const anyBtn = (idx) => allP.some(p => p && p.connected && gpBtn(p, idx));
    const anyVal = (idx) => allP.reduce((m, p) => p && p.connected ? Math.max(m, gpVal(p, idx)) : m, 0);
    const prev = gp.prev;

    const menuL2=anyVal(6)>0.5,menuR2=anyVal(7)>0.5;
    if(inventoryOpen&&!invClosing){
     if(menuL2&&!prev.menuL2)inventoryArea('slots');
     if(menuR2&&!prev.menuR2)inventoryArea('library');
    }
    prev.menuL2=menuL2;prev.menuR2=menuR2;
    const r2 = !inventoryOpen && !invClosing && anyVal(7) > 0.5;
    if (r2 && !(prev['_r2'] ?? false)) tryShoot();
    mouse.held = r2;
    prev['_r2'] = r2;

    const l1 = anyBtn(4), r1 = anyBtn(5);
    if (inventoryOpen || invClosing) {
      player.rightHeld = false;
      player.chargeTime = 0;
      gp.blockMenuSlash = true;
      if (!invClosing) {
        const step = Number(r1 && !prev['_r1']) - Number(l1 && !prev['_l1']);
        if (step) {
          switchInventoryTab();
        }
      }
    } else if (gp.blockMenuSlash) {
      // Require release before restoring combat, including after closing the menu.
      if (!r1) gp.blockMenuSlash = false;
    } else {
      if (r1 && !prev['_r1']) player.rightHeld = true;
      if (!r1 && prev['_r1']) {
        if (player.chargeTime >= MAX_CHARGE) doSpinSlash();
        else doSlash();
        player.chargeTime = 0;
        player.rightHeld = false;
      }
    }
    prev['_l1'] = l1;
    prev['_r1'] = r1;

    const circle = anyBtn(1);
    if (circle && !(prev['_b1'] ?? false)) {
      if (inventoryOpen) {
        if(selectedCore){selectedCore=null;invDirty=true;}
        else if (pendingSlot >= 0) { pendingSlot = -1; invSection = 'slots'; }
        else if (pendingFrameSlot) { pendingFrameSlot = false; invSection = 'slots'; invRightCursor = -1; }
        else closeInventory();
      } else doDodge();
    }
    prev['_b1'] = circle;

    player.guarding = !inventoryOpen && !invClosing && anyVal(6) > 0.5;

    const sq = anyBtn(2);
    if(sq && !prev['_sq'] && inventoryOpen && !invClosing) sortInventory();
    prev['_sq'] = sq;

    const tri = anyBtn(3);
    if (tri && !(prev['_b3'] ?? false)) { if (inventoryOpen) closeInventory(); else if (!invClosing) openInventory(); }
    prev['_b3'] = tri;

    const cross = anyBtn(0);
    if(cross && !prev['_b0'] && inventoryOpen && !invClosing) inventoryConfirm();
    prev['_b0'] = cross;

    // D-pad navigation in inventory
    if (inventoryOpen) {
      const fc = equippedFrame.cols, fr = equippedFrame.rows;

      const gpNav = inventoryMove;

      // One shared repeat timer for D-pad and left-stick menu navigation.
      const pad = allP[gp.mainPadIndex];
      const sx = pad?.axes[0] || 0, sy = pad?.axes[1] || 0;
      let dir = anyBtn(15) ? 'right' : anyBtn(14) ? 'left'
        : anyBtn(13) ? 'down' : anyBtn(12) ? 'up' : null;
      if (!dir && Math.max(Math.abs(sx), Math.abs(sy)) > 0.55) {
        dir = Math.abs(sx) > Math.abs(sy)
          ? (sx > 0 ? 'right' : 'left') : (sy > 0 ? 'down' : 'up');
      }
      const now = performance.now();
      if (dir && (dir !== gp.menuDir || now >= gp.menuNext)) {
        gpNav(dir);
        gp.menuNext = now + (dir !== gp.menuDir ? 300 : 110);
      }
      gp.menuDir = dir;

    }

    if (!inventoryOpen) gp.menuDir = null;

    const b9 = anyBtn(9);
    if (b9 && !(prev['_b9'] ?? false)) spawnEnemy();
    prev['_b9'] = b9;

    const b8 = anyBtn(8);
    if (b8 && !(prev['_b8'] ?? false)) location.reload();
    prev['_b8'] = b8;
  }
  if (inventoryOpen && inventoryBefore !== JSON.stringify([inventoryOpen, invSection,
      invRightCursor, invFrameCursor, invLeftCursor, pendingSlot, pendingFrameSlot])) {
    invDirty = true;
  }
}

function updatePlayer(dt) {
  // Keyboard movement (skip if gamepad left stick is active)
  let mx = 0, my = 0;
  if (!keys['_gpL']) {
    if (keys['w'] || keys['arrowup'])    my -= 1;
    if (keys['s'] || keys['arrowdown'])  my += 1;
    if (keys['a'] || keys['arrowleft'])  mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const ml = Math.hypot(mx, my) || 1;
    if (mx || my) { mx /= ml; my /= ml; }
    player.vx = player.vx * Math.pow(0.75, dt) + mx * 3.8 * equipStats.speedMult * (1 - Math.pow(0.75, dt));
    player.vy = player.vy * Math.pow(0.75, dt) + my * 3.8 * equipStats.speedMult * (1 - Math.pow(0.75, dt));
  }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  resolveWall(player, 12);

  // Player-enemy collision
  for (const e of enemies) {
    if (!e.alive) continue;
    const eRad = Math.max(e.cols, e.rows) * BLOCK / 2 + 4;
    const minDist = 12 + eRad;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0 && dist < minDist) {
      const overlap = minDist - dist;
      const nx = dx / dist, ny = dy / dist;
      // Push player away 70%, nudge enemy 30%
      player.x += nx * overlap * 0.7;
      player.y += ny * overlap * 0.7;
      e.x -= nx * overlap * 0.3;
      e.y -= ny * overlap * 0.3;
      // Dampen velocity components along collision axis
      const pDot = player.vx * nx + player.vy * ny;
      if (pDot < 0) { player.vx -= pDot * nx * 0.6; player.vy -= pDot * ny * 0.6; }
      const eDot = e.vx * nx + e.vy * ny;
      if (eDot > 0) { e.vx -= eDot * nx * 0.4; e.vy -= eDot * ny * 0.4; }
    }
  }

  playerTrail.unshift({ x: player.x, y: player.y, a: player.angle });
  if (playerTrail.length > 8) playerTrail.pop();

  if (!gp.aimActive) {
    const spd2 = Math.hypot(player.vx, player.vy);
    if (spd2 > 0.8) {
      // Auto-face movement direction; keep reticle at fixed distance so it stays on screen
      player.angle = Math.atan2(player.vy, player.vx);
      mouse.x = W/2 + Math.cos(player.angle) * 120;
      mouse.y = H/2 + Math.sin(player.angle) * 120;
    } else {
      // Stopped: restore real mouse position, but only update angle if mouse has been moved
      mouse.x = mouse.realX; mouse.y = mouse.realY;
      if (mouse.hasMoved) player.angle = Math.atan2(mouse.y - H/2, mouse.x - W/2);
      // else keep current angle (last facing direction from movement)
    }
  }
  if (player.cooldown > 0)      player.cooldown -= dt;
  if (player.muzzle > 0)        player.muzzle -= dt;
  if (player.slashCooldown > 0) player.slashCooldown -= dt;
  if (player.dodgeCooldown > 0) player.dodgeCooldown -= dt;
  if (player.dodgeTimer    > 0) player.dodgeTimer    -= dt;
  if (player.collectFlash > 0)  player.collectFlash -= dt;

  if (player.rightHeld && player.slashCooldown <= 0)
    player.chargeTime = Math.min(player.chargeTime + dt, MAX_CHARGE);
  if (mouse.held && player.cooldown <= 0) tryShoot();

  // Advance slash visuals
  for (let i = slashes.length - 1; i >= 0; i--) {
    slashes[i].life -= slashes[i].decay * dt;
    if (slashes[i].life <= 0) slashes.splice(i, 1);
  }

  player.orbitAngle += 0.045 * equipStats.orbitSpeedMult * dt;

  // Camera follows player
  camX = W/2 - player.x;
  camY = H/2 - player.y;
  shake *= Math.pow(0.82, dt);

  // Orbiting triangles damage enemies and walls
  {
    const ORBIT_R = 50;
    const orbitTotal = (activeSkills.has(2) ? 3 : 0) + equipStats.extraOrbits;
    for (let i = 0; i < orbitTotal; i++) {
      const oa = player.orbitAngle + (i / orbitTotal) * Math.PI * 2;
      const ox = player.x + Math.cos(oa) * ORBIT_R;
      const oy = player.y + Math.sin(oa) * ORBIT_R;
      for (const e of enemies) {
        if (!e.alive) continue;
        const half = Math.max(e.cols, e.rows) * BLOCK / 2 + 4;
        if (Math.abs(ox - e.x) > half || Math.abs(oy - e.y) > half) continue;
        chipEnemy(e, ox, oy);
      }
      if (dungeon.length) {
        const otx = Math.floor((ox - DOX) / TILE);
        const oty = Math.floor((oy - DOY) / TILE);
        if (otx >= 0 && otx < DW && oty >= 0 && oty < DH) {
          const wh = dungeon[oty][otx];
          if (wh > 0 && wh < 999) damageWall(otx, oty, ox, oy, oa + Math.PI);
        }
      }
    }
  }
}

function updateGold(dt) {
  if (player.goldDisplay < player.exp) {
    const diff = player.exp - player.goldDisplay;
    const step = Math.max(1, Math.floor(diff * 0.25));
    player.goldDisplay = Math.min(player.exp, player.goldDisplay + step);
  }
  if (player.goldPop > 0) player.goldPop = Math.max(0, player.goldPop - 0.07 * dt);
  for (let i = pickupLog.length - 1; i >= 0; i--) {
    pickupLog[i].life -= 0.0055 * dt;
    pickupLog[i].slideAge += dt;
    if (pickupLog[i].life <= 0) pickupLog.splice(i, 1);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.prev = { x: b.x, y: b.y };
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (Math.hypot(b.x - player.x, b.y - player.y) > 700) { bullets.splice(i, 1); continue; }
    {
      const btx = Math.floor((b.x - DOX) / TILE);
      const bty = Math.floor((b.y - DOY) / TILE);
      const wallHp = (btx < 0 || btx >= DW || bty < 0 || bty >= DH) ? 999 : dungeon[bty][btx];
      if (wallHp > 0) {
        damageWall(btx, bty, b.x, b.y, Math.atan2(b.vy, b.vx));
        bullets.splice(i, 1);
        continue;
      }
    }
    let hit = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      const half = Math.max(e.cols, e.rows) * BLOCK / 2 + 4;
      if (Math.abs(b.x - e.x) > half || Math.abs(b.y - e.y) > half) continue;
      if (chipEnemy(e, b.x, b.y)) { hit = true; break; }
    }
    if (hit) bullets.splice(i, 1);
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d > 90) { e.vx += (dx/d)*0.035*dt; e.vy += (dy/d)*0.035*dt; }
    e.vx *= Math.pow(0.95, dt); e.vy *= Math.pow(0.95, dt);
    e.x += e.vx * dt; e.y += e.vy * dt;
    resolveWall(e, Math.max(e.cols, e.rows) * BLOCK / 2 + 4);
    e.angle += 0.005 * dt;
    e.blinkT += 0.025 * dt;

    // Core afterimage trail
    const spd = Math.hypot(e.vx, e.vy);
    if (spd > 0.3 && coreTrails.length < 400) {
      const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
      const cos = Math.cos(e.angle), sin = Math.sin(e.angle);
      for (let r = 0; r < e.rows; r++) {
        for (let c = 0; c < e.cols; c++) {
          if (!e.grid[r][c].alive || !e.grid[r][c].isCore) continue;
          const lx = -gw/2 + c*BLOCK + CELL/2, ly = -gh/2 + r*BLOCK + CELL/2;
          coreTrails.push({
            x: e.x + cos*lx - sin*ly,
            y: e.y + sin*lx + cos*ly,
            life: 1, decay: 0.022 + Math.random() * 0.012
          });
        }
      }
    }
    if (e.hitFlash > 0)  e.hitFlash -= dt;
    if (e.coreFlash > 0) e.coreFlash -= dt;
    if (e.alpha < 1) e.alpha = Math.min(1, e.alpha + 0.016 * dt);

    // Shell self-repair: restore one non-core cell periodically while core lives
    {
      const coreAlive = e.grid.some(row => row.some(cell => cell.isCore && cell.alive));
      if (coreAlive) {
        const deadNonCore = [];
        for (let r = 0; r < e.rows; r++)
          for (let c = 0; c < e.cols; c++)
            if (!e.grid[r][c].alive && !e.grid[r][c].isCore)
              deadNonCore.push([r, c]);
        if (deadNonCore.length > 0) {
          e.repairTimer -= dt;
          if (e.repairTimer <= 0) {
            const [pr, pc] = deadNonCore[Math.floor(Math.random() * deadNonCore.length)];
            e.grid[pr][pc].alive = true;
            e.repairTimer = 55;
            const gw2 = e.cols * BLOCK, gh2 = e.rows * BLOCK;
            const ox2 = -gw2/2, oy2 = -gh2/2;
            const lcx2 = ox2 + pc*BLOCK + CELL/2, lcy2 = oy2 + pr*BLOCK + CELL/2;
            const wcos2 = Math.cos(e.angle), wsin2 = Math.sin(e.angle);
            const rwx = e.x + wcos2*lcx2 - wsin2*lcy2;
            const rwy = e.y + wsin2*lcx2 + wcos2*lcy2;
            for (let i = 0; i < 6; i++) {
              const a = Math.random() * Math.PI * 2;
              sparks.push({ x: rwx, y: rwy,
                vx: Math.cos(a)*(1+Math.random()*2.5), vy: Math.sin(a)*(1+Math.random()*2.5),
                life: 1, decay: 0.03+Math.random()*0.03, r: 1.8, isCore: false });
            }
          }
        }
      }
    }

    // Core relocation: move core to a different cell after timeout
    if (!e.coreMoveTimer) e.coreMoveTimer = 480;
    e.coreMoveTimer -= dt;
    if (e.coreMoveTimer <= 0) {
      const aliveNonCore = [];
      for (let r = 0; r < e.rows; r++)
        for (let c = 0; c < e.cols; c++)
          if (e.grid[r][c].alive && !e.grid[r][c].isCore)
            aliveNonCore.push([r, c]);
      if (aliveNonCore.length > 0) {
        for (let r = 0; r < e.rows; r++)
          for (let c = 0; c < e.cols; c++)
            e.grid[r][c].isCore = false;
        const [nr, nc] = aliveNonCore[Math.floor(Math.random() * aliveNonCore.length)];
        e.grid[nr][nc].isCore = true;
        e.coreFlash = 14;
        const gw2 = e.cols * BLOCK, gh2 = e.rows * BLOCK;
        const ox2 = -gw2/2, oy2 = -gh2/2;
        const lcx2 = ox2 + nc*BLOCK + CELL/2, lcy2 = oy2 + nr*BLOCK + CELL/2;
        const wcos2 = Math.cos(e.angle), wsin2 = Math.sin(e.angle);
        const nwx = e.x + wcos2*lcx2 - wsin2*lcy2;
        const nwy = e.y + wsin2*lcx2 + wcos2*lcy2;
        for (let i = 0; i < 12; i++) {
          const a = Math.random() * Math.PI * 2;
          sparks.push({ x: nwx, y: nwy,
            vx: Math.cos(a)*(2+Math.random()*4), vy: Math.sin(a)*(2+Math.random()*4),
            life: 1, decay: 0.022+Math.random()*0.022, r: 2.2, isCore: true });
        }
      }
      e.coreMoveTimer = 420 + Math.floor(Math.random() * 300);
    }

    // Separation: push apart overlapping enemies
    for (const other of enemies) {
      if (other === e || !other.alive) continue;
      const sep = (Math.max(e.cols, e.rows) + Math.max(other.cols, other.rows)) * BLOCK / 2 + 14;
      const sdx = e.x - other.x, sdy = e.y - other.y;
      const sd = Math.hypot(sdx, sdy);
      if (sd < sep && sd > 0) {
        const f = (sep - sd) / sep * 0.4;
        e.vx += (sdx/sd)*f*dt; e.vy += (sdy/sd)*f*dt;
      }
    }
  }
}

function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.phase += 0.08 * dt;
    o.timer -= dt;
    if (o.timer <= 0) { orbs.splice(i, 1); continue; }
    const dx = player.x - o.x, dy = player.y - o.y;
    const d = Math.hypot(dx, dy);
    const attractStr = d < 120 ? 0.18 : 0.04;
    o.vx = o.vx * Math.pow(0.92, dt) + (dx / (d || 1)) * attractStr * dt;
    o.vy = o.vy * Math.pow(0.92, dt) + (dy / (d || 1)) * attractStr * dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (d < 16) {
      player.exp += o.value;
      player.goldPop = 1.0;
      player.collectFlash = 8;
      spawnGoldBurst(o.x, o.y, o.value);
      orbs.splice(i, 1);
      rumble(0, 0.18 * Math.min(o.value / 5, 1.0), 40);
    }
  }
}

function updateDrops(dt) {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.phase += 0.06 * dt;
    d.timer -= dt;
    if (d.timer <= 0) { drops.splice(i, 1); continue; }
    const dx = player.x - d.x, dy = player.y - d.y;
    const dist = Math.hypot(dx, dy);
    const attract = dist < 100 ? 0.14 : 0.02;
    d.vx = d.vx * Math.pow(0.90, dt) + (dx / (dist || 1)) * attract * dt;
    d.vy = d.vy * Math.pow(0.90, dt) + (dy / (dist || 1)) * attract * dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (dist < 18) {
      if (d.kind === 'core') {
        coreInventory.push(d.data);
        if (coreInventory.length > 20) coreInventory.shift();
        pickupLog.push({ label: `${d.data.label}  ${d.data.rarity.label}`, color: d.data.rarity.color, life: 1, slideAge: 0 });
      } else {
        frameInventory.push(d.data);
        if (frameInventory.length > 20) frameInventory.shift();
        pickupLog.push({ label: `${d.data.label}  ${d.data.rarity.label}`, color: d.data.rarity.color, life: 1, slideAge: 0 });
      }
      if (pickupLog.length > 10) pickupLog.shift();
      drops.splice(i, 1);
      player.collectFlash = 8;
      rumble(0, 0.28, 80);
    }
  }
}

function updateParticles(dt) {
  if (shards.length > 200) shards.splice(0, shards.length - 200);
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.pow(0.94, dt); s.vy *= Math.pow(0.94, dt);
    s.rot += s.rotV * dt;
    s.life -= s.decay * dt;
    if (s.life <= 0) {
      if (s.fromEnemy && debris.length < 600) {
        const count = 2 + Math.floor(Math.random() * 2);
        for (let di = 0; di < count && debris.length < 600; di++) {
          const ox = (Math.random() - 0.5) * s.size * 0.6;
          const oy = (Math.random() - 0.5) * s.size * 0.6;
          const px = s.x + ox, py = s.y + oy;
          const dtx = Math.floor((px - DOX) / TILE), dty = Math.floor((py - DOY) / TILE);
          const onFloor = dtx >= 0 && dtx < DW && dty >= 0 && dty < DH && dungeon[dty][dtx] === 0;
          if (onFloor)
            debris.push({ x: px, y: py, rot: Math.random() * Math.PI * 2,
              size: s.size * (0.15 + Math.random() * 0.2), isCore: s.isCore });
        }
      }
      shards.splice(i, 1);
    }
  }
  if (debris.length > 800) debris.splice(0, debris.length - 800);
  for (let i = coreTrails.length - 1; i >= 0; i--) {
    coreTrails[i].life -= coreTrails[i].decay * dt;
    if (coreTrails[i].life <= 0) coreTrails.splice(i, 1);
  }

  if (sparks.length > 250) sparks.splice(0, sparks.length - 250);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.pow(0.9, dt); s.vy *= Math.pow(0.9, dt);
    s.life -= s.decay * dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  if (goldBursts.length > 300) goldBursts.splice(0, goldBursts.length - 300);
  for (let i = goldBursts.length - 1; i >= 0; i--) {
    const gb = goldBursts[i];
    gb.x += gb.vx * dt; gb.y += gb.vy * dt;
    gb.vx *= Math.pow(0.87, dt); gb.vy *= Math.pow(0.87, dt);
    gb.rot += gb.rotV * dt;
    gb.life -= gb.decay * dt;
    if (gb.life <= 0) goldBursts.splice(i, 1);
  }
}

function update(dt) {
  updateGold(dt);
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateOrbs(dt);
  updateDrops(dt);
  updateParticles(dt);
}

</script>
<script>
// ── Draw sub-functions ────────────────────────────────────────────────────────

function drawDungeon() {
  if (!dungeon.length) return;
  const txMin = Math.max(0, Math.floor((-camX - DOX) / TILE) - 1);
  const txMax = Math.min(DW - 1, Math.floor((W - camX - DOX) / TILE) + 1);
  const tyMin = Math.max(0, Math.floor((-camY - DOY) / TILE) - 1);
  const tyMax = Math.min(DH - 1, Math.floor((H - camY - DOY) / TILE) + 1);

  for (let ty = tyMin; ty <= tyMax; ty++) {
    for (let tx = txMin; tx <= txMax; tx++) {
      const hp = dungeon[ty][tx];
      const sx = DOX + tx * TILE + camX;
      const sy = DOY + ty * TILE + camY;

      if (hp === 0) {
        // ── フロアタイル ──────────────────────────────────────────────
        ctx.fillStyle = THEME.floor;
        ctx.fillRect(sx, sy, TILE, TILE);

        // アンビエントオクルージョン: 壁に接する辺を暗く
        const N = ty > 0      && dungeon[ty - 1][tx] !== 0;
        const S = ty < DH - 1 && dungeon[ty + 1][tx] !== 0;
        const W = tx > 0      && dungeon[ty][tx - 1] !== 0;
        const E = tx < DW - 1 && dungeon[ty][tx + 1] !== 0;
        if (N || S || W || E) {
          ctx.fillStyle = 'rgba(0,0,0,0.42)';
          if (N) ctx.fillRect(sx,            sy,            TILE, 2);
          if (S) ctx.fillRect(sx,            sy + TILE - 2, TILE, 2);
          if (W) ctx.fillRect(sx,            sy,            2, TILE);
          if (E) ctx.fillRect(sx + TILE - 2, sy,            2, TILE);
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          if (N) ctx.fillRect(sx,            sy + 2,        TILE, 2);
          if (S) ctx.fillRect(sx,            sy + TILE - 4, TILE, 2);
          if (W) ctx.fillRect(sx + 2,        sy,            2, TILE);
          if (E) ctx.fillRect(sx + TILE - 4, sy,            2, TILE);
        }

      } else if (hp === 999) {
        // ── 堅牢壁 ───────────────────────────────────────────────────
        ctx.fillStyle = '#020202';
        ctx.fillRect(sx, sy, TILE, TILE);

      } else {
        // ── 破壊可能壁 ───────────────────────────────────────────────
        ctx.fillStyle = THEME.wallColors[hp - 1];
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.strokeStyle = 'rgba(104,104,104,0.06)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);

        if (hp === 1) {
          const seed = tx * 7919 + ty * 3571;
          ctx.strokeStyle = 'rgba(17,17,17,0.65)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          const cx2 = sx + TILE / 2, cy2 = sy + TILE / 2;
          const cr = ((seed % 7) / 7) * Math.PI * 2;
          ctx.moveTo(cx2 + Math.cos(cr) * 3,             cy2 + Math.sin(cr) * 3);
          ctx.lineTo(cx2 + Math.cos(cr) * (TILE * 0.42), cy2 + Math.sin(cr) * (TILE * 0.42));
          const cr2 = cr + 0.9;
          ctx.moveTo(cx2 + Math.cos(cr2) * 2,             cy2 + Math.sin(cr2) * 2);
          ctx.lineTo(cx2 + Math.cos(cr2) * (TILE * 0.28), cy2 + Math.sin(cr2) * (TILE * 0.28));
          ctx.stroke();
        }
      }
    }
  }
}

function drawDrops() {
  for (const d of debris) {
    const wx = d.x + camX, wy = d.y + camY;
    ctx.save();
    ctx.translate(wx, wy); ctx.rotate(d.rot);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = d.isCore ? '#1a1a1a' : '#3e3e3e';
    const sz = d.size;
    ctx.fillRect(-sz/2, -sz/2, sz, sz);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  for (const d of drops) {
    const wx = d.x + camX, wy = d.y + camY;
    const pulse = 0.85 + Math.sin(d.phase) * 0.15;
    const r = 7 * pulse;
    const col = d.data.rarity.color;
    const alpha = d.timer < 90 ? Math.abs(Math.sin(d.timer * 0.12)) : 1;
    const ph = d.phase;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(wx, wy);

    // 外側ソフトグロー
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 6.5);
    g.addColorStop(0, col + 'cc');
    g.addColorStop(0.3, col + '55');
    g.addColorStop(1, col + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 6.5, 0, Math.PI * 2); ctx.fill();

    // パルスリング (2本が交互に外に拡散)
    for (let ri = 0; ri < 2; ri++) {
      const ringT = ((ph * 0.45 + ri * Math.PI) % (Math.PI * 2)) / (Math.PI * 2);
      const ringR = r * (1.6 + ringT * 4.5);
      ctx.save();
      ctx.globalAlpha = alpha * (1 - ringT) * 0.65;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.0 - ringT * 1.4;
      ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // 回転6線スター (白グラデーションフェード)
    ctx.save();
    ctx.rotate(ph * 0.38);
    for (let i = 0; i < 6; i++) {
      const sa = (i / 6) * Math.PI * 2;
      const len = r * (i % 2 === 0 ? 4.5 : 2.8);
      const ex = Math.cos(sa) * len, ey = Math.sin(sa) * len;
      const lg = ctx.createLinearGradient(0, 0, ex, ey);
      lg.addColorStop(0, 'rgba(255,255,255,0.95)');
      lg.addColorStop(0.45, 'rgba(255,255,255,0.3)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.restore();

    // 逆回転4線 (レアリティカラーフェード)
    ctx.save();
    ctx.rotate(-ph * 0.62 + Math.PI / 4);
    for (let i = 0; i < 4; i++) {
      const sa = (i / 4) * Math.PI * 2;
      const len = r * 3.2;
      const ex = Math.cos(sa) * len, ey = Math.sin(sa) * len;
      const lg2 = ctx.createLinearGradient(0, 0, ex, ey);
      lg2.addColorStop(0, col + 'ff');
      lg2.addColorStop(0.6, col + '55');
      lg2.addColorStop(1, col + '00');
      ctx.strokeStyle = lg2;
      ctx.lineWidth = 1.0;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.restore();

    // オービット小ダイヤ (5個・異なる速度と半径)
    for (let i = 0; i < 5; i++) {
      const angle = ph * (0.85 + i * 0.23) + (i / 5) * Math.PI * 2;
      const orbitR = r * (2.1 + (i % 3) * 0.95);
      const sx = Math.cos(angle) * orbitR;
      const sy = Math.sin(angle) * orbitR;
      const ss = r * (0.30 + Math.sin(ph * 1.9 + i * 1.4) * 0.10);
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(angle + Math.PI / 4);
      ctx.shadowColor = i % 2 === 0 ? '#ffffff' : col;
      ctx.shadowBlur = 8;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.98)' : col;
      ctx.beginPath();
      ctx.moveTo(0, -ss * 1.3); ctx.lineTo(ss * 0.65, 0);
      ctx.lineTo(0, ss * 1.3); ctx.lineTo(-ss * 0.65, 0);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 本体 (グラデーション塗り)
    glow(col, 30);
    const bodyG = ctx.createRadialGradient(0, -r * 0.5, 0, 0, 0, r * 2.1);
    bodyG.addColorStop(0, '#ffffff');
    bodyG.addColorStop(0.22, col);
    bodyG.addColorStop(1, col + '99');
    ctx.fillStyle = bodyG;
    ctx.beginPath();
    if (d.kind === 'frame') {
      ctx.moveTo(0, -r * 1.7);
      ctx.lineTo(r * 1.5, r * 1.1);
      ctx.lineTo(-r * 1.5, r * 1.1);
    } else {
      ctx.moveTo(0, -r * 1.5); ctx.lineTo(r * 0.9, 0);
      ctx.lineTo(0,  r * 1.5); ctx.lineTo(-r * 0.9, 0);
    }
    ctx.closePath(); ctx.fill();
    noGlow();

    // ハイライト
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.beginPath();
    if (d.kind === 'frame') {
      ctx.moveTo(0, -r * 1.7); ctx.lineTo(r * 1.5, r * 1.1); ctx.lineTo(0, r * 0.1);
    } else {
      ctx.moveTo(0, -r * 1.5); ctx.lineTo(r * 0.9, 0); ctx.lineTo(0, 0);
    }
    ctx.closePath(); ctx.fill();

    // 中心輝点グラデーション
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.65);
    cg.addColorStop(0, 'rgba(255,255,255,1)');
    cg.addColorStop(0.5, 'rgba(255,255,255,0.7)');
    cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

function drawParticles() {
  for (const s of shards) {
    const wx = s.x + camX, wy = s.y + camY;
    ctx.save();
    ctx.translate(wx, wy); ctx.rotate(s.rot);
    ctx.globalAlpha = s.life * s.life;
    ctx.fillStyle = s.isCore ? THEME.red : '#464646';
    ctx.fillRect(-s.size/2*s.life, -s.size/2*s.life, s.size*s.life, s.size*s.life);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  for (const s of sparks) {
    const wx = s.x + camX, wy = s.y + camY;
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.isCore ? THEME.red : '#313131';
    ctx.fillRect(wx - s.r, wy - s.r, s.r*2, s.r*2);
    ctx.globalAlpha = 1;
  }

  for (const gb of goldBursts) {
    const wx = gb.x + camX, wy = gb.y + camY;
    const s  = gb.size * (0.4 + gb.life * 0.6);
    ctx.save();
    ctx.globalAlpha = gb.life * gb.life;
    ctx.translate(wx, wy);
    ctx.rotate(gb.rot);
    ctx.shadowColor = '#d0d0d0';
    ctx.shadowBlur  = 7;
    const sg = ctx.createLinearGradient(-s, -s, s, s);
    sg.addColorStop(0,    '#f6f6f6');
    sg.addColorStop(0.35, '#d0d0d0');
    sg.addColorStop(1,    '#949494');
    ctx.fillStyle = sg;
    ctx.fillRect(-s, -s * 0.78, s * 2, s * 1.56);
    // ハイライト
    ctx.fillStyle = 'rgba(255,255,255,' + (gb.life * 0.55) + ')';
    ctx.fillRect(-s, -s * 0.78, s * 0.9, s * 0.7);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  for (const o of orbs) {
    ctx.save();
    ctx.globalAlpha = o.timer < 60 ? Math.abs(Math.sin(o.timer * 0.16)) : 1;
    drawOrb(o.x + camX, o.y + camY, o.phase);
    ctx.restore();
  }
}

function drawOrb(ox, oy, phase) {
  const pulse = 0.85+Math.sin(phase)*0.15;
  const r = 5*pulse;

  ctx.save();
  ctx.translate(ox,oy);

  // 外側グロー（青、薄め）
  const g = ctx.createRadialGradient(0,0,0,0,0,r*3.5);
  g.addColorStop(0, 'rgba(30,80,180,0.35)');
  g.addColorStop(1, 'rgba(10,30,100,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,r*3.5,0,Math.PI*2); ctx.fill();

  // スパークライン（白）
  ctx.save();
  ctx.rotate(phase*0.8);
  ctx.strokeStyle = 'rgba(200,220,255,0.45)';
  ctx.lineWidth = 0.7;
  for(let si=0;si<4;si++){
    const sa=(si/4)*Math.PI*2;
    const len=r*(si%2===0?2.8:1.8);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(sa)*len,Math.sin(sa)*len); ctx.stroke();
  }
  ctx.restore();

  // ダイヤ本体（青差し色）
  const dr=r*pulse;
  glow(THEME.blue, 14);
  ctx.fillStyle = THEME.blueHi;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(0,-dr*1.45); ctx.lineTo(dr*.85,0); ctx.lineTo(0,dr*1.45); ctx.lineTo(-dr*.85,0);
  ctx.closePath(); ctx.fill();
  noGlow();
  ctx.globalAlpha = 1;

  // ハイライト（白）
  ctx.fillStyle = 'rgba(220,235,255,0.75)';
  ctx.beginPath(); ctx.moveTo(0,-dr*1.45); ctx.lineTo(dr*.85,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(dr*.1,-dr*.25,dr*.22,0,Math.PI*2); ctx.fill();

  ctx.restore();
}


function drawEnemies() {
  // Core afterimage trails (drawn before enemies so they appear behind)
  for (const t of coreTrails) {
    const wx = t.x + camX, wy = t.y + camY;
    const a = t.life * t.life;
    const r = CELL * 0.6 * (0.4 + t.life * 0.6);
    ctx.save();
    const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, r);
    g.addColorStop(0, `rgba(57,57,57,${a * 0.55})`);
    g.addColorStop(1, `rgba(26,26,26,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const wx = e.x + camX, wy = e.y + camY;
    const breathe = 0.97 + Math.sin(e.blinkT * 0.18) * 0.03;
    ctx.save();
    ctx.translate(wx, wy);
    ctx.scale(breathe, breathe);
    ctx.rotate(e.angle);
    ctx.globalAlpha = e.alpha ?? 1;
    const gw = e.cols * BLOCK, gh = e.rows * BLOCK;
    const ox = -gw/2, oy = -gh/2;
    const blink = Math.sin(e.blinkT * 0.18) * 0.5 + 0.5;
    for (let r = 0; r < e.rows; r++) {
      for (let c = 0; c < e.cols; c++) {
        const cell = e.grid[r][c];
        if (!cell.alive) continue;
        const cx = ox + c * BLOCK, cy = oy + r * BLOCK;
        if (cell.isCore) {
          // コアのみ赤差し色
          const rv = Math.floor(100 + blink * 120);
          glow(`rgb(${rv},0,0)`, 16);
          ctx.fillStyle = `rgb(${rv},0,0)`;
          ctx.fillRect(cx, cy, CELL, CELL);
          noGlow();
        } else {
          const flash = e.hitFlash > 0 ? e.hitFlash / 6 : 0;
          const v = Math.floor((cell.hp === 2 ? 180 : 110) + flash * 75);
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(cx, cy, CELL, CELL);
          ctx.strokeStyle = 'rgba(0,0,0,0.35)';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(cx, cy, CELL, CELL);
        }
      }
    }
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    const bx = b.x + camX, by = b.y + camY;
    if (b.prev) {
      const px = b.prev.x + camX, py = b.prev.y + camY;
      // トレイル
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = 'rgba(189,189,189,0.22)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    glow(THEME.white, 12);
    ctx.fillStyle = THEME.white;
    ctx.fillRect(bx - 2.5, by - 2.5, 5, 5);
    noGlow();
  }
}

function drawSlashes() {
  for (const s of slashes) {
    const wx = s.x + camX, wy = s.y + camY;
    const t = s.life;

    if (s.hit === 'spin') {
      const expand = 1 - t;
      const rOuter = s.r * (0.6 + expand * 0.5);
      const rInner = s.r * (0.3 + expand * 0.4);

      ctx.save();
      ctx.globalAlpha = t * t * 0.9;
      glow('#ffffff', 18);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3 * t;
      ctx.beginPath();
      ctx.arc(wx, wy, rOuter, 0, Math.PI * 2);
      ctx.stroke();
      noGlow();
      ctx.globalAlpha = 1;
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = t * t * 0.55;
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 1.5 * t;
      ctx.beginPath();
      ctx.arc(wx, wy, rInner, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();

      const lineN = 8;
      for (let li = 0; li < lineN; li++) {
        const la = s.spinAngle + (li / lineN) * Math.PI * 2 + expand * Math.PI * 2;
        ctx.save();
        ctx.globalAlpha = t * 0.7;
        glow('#ffffff', 10);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(wx + Math.cos(la) * rInner * 0.5, wy + Math.sin(la) * rInner * 0.5);
        ctx.lineTo(wx + Math.cos(la) * rOuter,       wy + Math.sin(la) * rOuter);
        ctx.stroke();
        noGlow();
        ctx.globalAlpha = 1;
        ctx.restore();
      }

    } else {
      const sweep = Math.min(1, (1 - t) * 3);

      ctx.save();
      ctx.globalAlpha = t * t * 0.18;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.arc(wx, wy, s.r * (0.4 + sweep * 0.6), s.arcFrom, s.arcFrom + (s.arcTo - s.arcFrom) * sweep);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();

      const lineCount = s.hit === 2 ? 4 : 3;
      for (let li = 0; li < lineCount; li++) {
        const frac = li / lineCount;
        const aSweep = s.arcFrom + (s.arcTo - s.arcFrom) * sweep * (0.6 + frac * 0.4);
        const r1 = s.r * (0.2 + frac * 0.5);
        const r2 = s.r * (0.55 + frac * 0.45);
        ctx.save();
        ctx.globalAlpha = t * (1 - frac * 0.5) * (s.hit === 2 ? 0.9 : 0.75);
        glow('#ffffff', 8);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = s.hit === 2 ? 2 : 1.5;
        ctx.beginPath();
        ctx.moveTo(wx + Math.cos(aSweep) * r1, wy + Math.sin(aSweep) * r1);
        ctx.lineTo(wx + Math.cos(aSweep) * r2, wy + Math.sin(aSweep) * r2);
        ctx.stroke();
        noGlow();
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = t * 0.85;
      glow('#ffffff', 14);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = s.hit === 2 ? 2.5 : 1.8;
      ctx.beginPath();
      ctx.arc(wx, wy, s.r * 0.82, s.arcFrom, s.arcFrom + (s.arcTo - s.arcFrom) * sweep);
      ctx.stroke();
      noGlow();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
}

function drawPlayer() {
  const px = player.x + camX, py = player.y + camY;
  const tip = player.tipOffset, backW = 13;

  // Orbiting triangles
  {
    const ORBIT_R = 50;
    const orbitTotal = (activeSkills.has(2) ? 3 : 0) + equipStats.extraOrbits;
    const ts = 7;
    for (let i = 0; i < orbitTotal; i++) {
      const oa = player.orbitAngle + (i / orbitTotal) * Math.PI * 2;
      const ox = px + Math.cos(oa) * ORBIT_R;
      const oy = py + Math.sin(oa) * ORBIT_R;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(oa + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, -ts);
      ctx.lineTo(ts * 0.7,  ts * 0.6);
      ctx.lineTo(-ts * 0.7, ts * 0.6);
      ctx.closePath();
      glow('#949494', 8);
      ctx.fillStyle = '#949494';
      ctx.fill();
      noGlow();
      ctx.restore();
    }
  }

  // Charge ring
  if (player.rightHeld && player.chargeTime > 0) {
    const frac = player.chargeTime / MAX_CHARGE;
    const full = frac >= 1;
    const pulseR = full ? (1 + Math.sin(Date.now() * 0.015) * 0.08) : 1;

    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, 28 * pulseR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = full ? 0.95 : 0.75;
    ctx.strokeStyle = full ? '#ffffff' : '#aaaaaa';
    ctx.lineWidth = full ? 2.5 : 2;
    ctx.beginPath();
    ctx.arc(px, py, 28 * pulseR, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Guard ring
  if (player.guarding) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, 44, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 前方スポットライト（暗闇オーバーレイの下地として焼き込む）
  {
    const fwdX = px + Math.cos(player.angle) * 70;
    const fwdY = py + Math.sin(player.angle) * 70;
    const sg = ctx.createRadialGradient(fwdX, fwdY, 0, fwdX, fwdY, 110);
    sg.addColorStop(0, 'rgba(255,255,255,0.12)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(fwdX, fwdY, 110, 0, Math.PI * 2);
    ctx.fill();
  }

  // 自機トレイル
  playerTrail.forEach((p, i) => {
    const a = (playerTrail.length - i) / playerTrail.length;
    ctx.save();
    ctx.globalAlpha = a * 0.12;
    ctx.translate(p.x + camX, p.y + camY); ctx.rotate(p.a);
    ctx.fillStyle = '#4a4a4a';
    ctx.beginPath();
    ctx.moveTo(tip, 0);
    ctx.lineTo(-tip * 0.5,  backW);
    ctx.lineTo(-tip * 0.5, -backW);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.angle);

  const isDodging  = player.dodgeTimer > 0;
  const dodgeBlink = isDodging && Math.floor(Date.now() / 70) % 2 === 0;
  const flashOn    = player.collectFlash > 0 || isDodging;
  if (isDodging) ctx.globalAlpha = dodgeBlink ? 1 : 0.35;
  glow(THEME.white, flashOn ? 28 : 10);
  ctx.fillStyle = flashOn ? THEME.white : THEME.hi;
  ctx.beginPath();
  ctx.moveTo(tip, 0);
  ctx.lineTo(-tip * 0.5, backW);
  ctx.lineTo(-tip * 0.5, -backW);
  ctx.closePath(); ctx.fill();
  noGlow();
  ctx.globalAlpha = 1;

  if (player.muzzle > 0) {
    const mf = player.muzzle / 7;
    glow('#ffffff', 24);
    ctx.fillStyle = `rgba(254,254,254,${mf * 0.9})`;
    const fs = 7 * mf;
    ctx.beginPath();
    ctx.arc(tip, 0, fs, 0, Math.PI * 2);
    ctx.fill();
    noGlow();
  }

  ctx.restore();
}


function drawHUD() {
  // Pickup log (bottom-right)
  // GOLD counter (top-right) — 金の欠片アイコン＋数字
  {
    const pop     = player.goldPop;
    const numStr  = String(player.goldDisplay);
    const baseX   = W - 14;
    const baseY   = 26;

    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px Orbitron';
    const numW = ctx.measureText(numStr).width;

    // 欠片グループ中心 (数字の左側)
    const shCX = baseX - numW - 22;
    const shCY = baseY - 6;

    // 2枚の欠片 (後ろ→前の順で描画)
    const shardDefs = [
      { ox: -4, oy:  3, size: 6,  rot:  0.6  },
      { ox:  4, oy: -3, size: 10, rot: -0.28, main: true },
    ];

    for (const sd of shardDefs) {
      const s    = sd.size * (sd.main ? 1 + pop * 0.22 : 1);
      const rota = sd.rot  + (sd.main ? pop * 0.12 : 0);

      ctx.save();
      ctx.translate(shCX + sd.ox, shCY + sd.oy);
      ctx.rotate(rota);

      // グロー
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur  = sd.main ? 14 : 6;

      // ゴールドグラデーション
      const sg = ctx.createLinearGradient(-s, -s, s, s);
      sg.addColorStop(0,    '#fffab8');
      sg.addColorStop(0.28, '#ffd700');
      sg.addColorStop(0.62, '#c8920a');
      sg.addColorStop(1,    '#6b4300');
      ctx.fillStyle = sg;
      ctx.fillRect(-s, -s, s * 2, s * 2);

      // ハイライト (左上)
      const hg = ctx.createLinearGradient(-s, -s, s * 0.4, s * 0.4);
      hg.addColorStop(0, 'rgba(255,255,255,0.72)');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.shadowBlur = 0;
      ctx.fillRect(-s, -s, s * 2, s * 2);

      ctx.restore();
    }

    // 数字 (ポップスケール)
    const ns = 1 + pop * 0.30;
    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.scale(ns, ns);
    ctx.font = 'bold 14px Orbitron';
    ctx.textAlign = 'right';
    ctx.shadowColor = '#888888';
    ctx.shadowBlur  = 8;
    ctx.fillStyle   = '#e1e1e1';
    ctx.fillText(numStr, 0, 0);
    ctx.shadowBlur  = 0;
    ctx.restore();

    ctx.textAlign = 'left';
  }

  // Pickup log — below GOLD counter
  if (pickupLog.length > 0) {
    ctx.font = '11px Orbitron';
    ctx.textAlign = 'right';
    const logStartY = 58;
    const lineH = 18;
    const SLIDE_FRAMES = 16;
    const FADE_LIFE   = 0.25;
    for (let i = 0; i < pickupLog.length; i++) {
      const entry = pickupLog[pickupLog.length - 1 - i];
      const slideP = Math.min(entry.slideAge / SLIDE_FRAMES, 1);
      const slideEase = 1 - Math.pow(1 - slideP, 3);
      const xOff = (1 - slideEase) * 260;
      const alpha = entry.life < FADE_LIFE ? entry.life / FADE_LIFE : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = entry.color;
      ctx.fillText(entry.label, W - 16 + xOff, logStartY + i * lineH);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  if (inventoryOpen && invDirty) { renderInvDOM(); invDirty = false; }

  // FPS counter (bottom-left)
  {
    const color = fps >= 55 ? '#cacaca' : fps >= 40 ? '#b5b5b5' : '#6c6c6c';
    ctx.font = '11px Orbitron';
    ctx.fillStyle = color;
    ctx.fillText(`${fps} FPS`, 12, H - 10);
  }

  // Crosshair
  if (inventoryOpen || invClosing) return;
  const cx = mouse.x, cy = mouse.y, cs = 8;
  ctx.strokeStyle = 'rgba(204,204,204,0.65)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx-cs,cy); ctx.lineTo(cx-3,cy);
  ctx.moveTo(cx+3, cy); ctx.lineTo(cx+cs,cy);
  ctx.moveTo(cx,cy-cs); ctx.lineTo(cx,cy-3);
  ctx.moveTo(cx,cy+3);  ctx.lineTo(cx,cy+cs);
  ctx.stroke();
  ctx.fillStyle = 'rgba(204,204,204,0.5)';
  ctx.fillRect(cx-1, cy-1, 2, 2);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = THEME.bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle line grid (camera-scrolling, not affected by shake)
  {
    const gs = 36;
    const offX = (camX % gs + gs) % gs, offY = (camY % gs + gs) % gs;
    ctx.strokeStyle = 'rgba(120,120,120,0.025)';
    ctx.lineWidth = 1;
    for (let x = offX; x < W; x += gs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = offY; y < H; y += gs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  const sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(sx, sy);

  drawDungeon();
  drawParticles();
  drawDrops();
  drawEnemies();
  drawBullets();
  drawSlashes();
  drawPlayer();

  ctx.restore();

  const vignette = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.82)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  // HUD drawn outside shake transform so it stays fixed
  drawHUD();
}

</script>
<script>
// ── Main loop ─────────────────────────────────────────────────────────────────
let lastFrameTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  const elapsed = now - lastFrameTime;
  lastFrameTime = now;
  if (elapsed > 200) return;
  const dt = elapsed / FRAME_MS;

  fpsFrameCount++;
  const fpsDelta = now - fpsLastTime;
  if (fpsDelta >= 500) {
    fps = Math.round(fpsFrameCount / fpsDelta * 1000);
    fpsFrameCount = 0;
    fpsLastTime = now;
  }

  updateInput(dt);
  if (!inventoryOpen && !invClosing) { if (hitStop > 0) { hitStop -= dt; } else { update(dt); } }
  draw();
}
requestAnimationFrame(loop);

</script>
